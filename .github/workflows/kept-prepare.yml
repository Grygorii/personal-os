name: Prepare Kept reliability branch
on:
  push:
    branches: [fix/kept-reading-reliability-20261114]
    paths: [scripts/prepare-kept.mjs, .github/workflows/kept-prepare.yml]
permissions:
  contents: write
concurrency:
  group: kept-reliability-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Grygorii/personal-os' && github.ref == 'refs/heads/fix/kept-reading-reliability-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/kept-reading-reliability-20261114
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact source edits, without production credentials
        run: node scripts/prepare-kept.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify syntax and diff
        run: |
          find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check webapp/library-sync.js
          git diff --check
      - name: Commit tested source changes to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/webserver.js src/coach.js src/auth.js src/config.js src/index.js reading/journal.html
          git commit -m "Readers keep their notes safely and the mentor can use what they saved"
          git push origin HEAD:fix/kept-reading-reliability-20261114
          git diff 12825f3bcd1c6bea393f55a3b352d6ae80cf272d HEAD -- . ':!scripts/prepare-kept.mjs' ':!.github/workflows/kept-prepare.yml' > /tmp/kept-review.patch
          git archive --format=zip HEAD -o /tmp/kept-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kept-tested-source
          path: |
            /tmp/kept-review.patch
            /tmp/kept-source.zip
          retention-days: 7
