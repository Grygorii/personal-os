<title>English → C2 study deck</title>
<style>

    :root{
      --paper:#0E1518; --surface:#172127; --raise:#1E2A30;
      --ink:#E7ECEC; --muted:#93A2A7; --faint:#6E7E83; --line:#27353B;
      --accent:#38B6C1; --accent-strong:#5FCbd4; --accent-tint:#123037;
      --good:#43B571; --good-tint:#12291C;
      --warn:#DBAE45; --warn-tint:#2C2410;
      --bad:#E1685C; --bad-tint:#301715;

  }
  :root[data-theme="light"]{
    --paper:#EDF1F0; --surface:#FFFFFF; --raise:#F6F8F8;
    --ink:#16232A; --muted:#5C6B72; --faint:#8A979C; --line:#DBE3E3;
    --accent:#0E7C86; --accent-strong:#0A5C64; --accent-tint:#E1F0F0;
    --good:#2E9E5E; --good-tint:#E4F3EA; --warn:#B98511; --warn-tint:#F6ECD6;

  }

    --paper:#0E1518; --surface:#172127; --raise:#1E2A30;
    --ink:#E7ECEC; --muted:#93A2A7; --faint:#6E7E83; --line:#27353B;
    --accent:#38B6C1; --accent-strong:#5FCbd4; --accent-tint:#123037;
    --good:#43B571; --good-tint:#12291C; --warn:#DBAE45; --warn-tint:#2C2410;
    --bad:#E1685C; --bad-tint:#301715;

  *{box-sizing:border-box}
  .wrap{max-width:600px;margin:0 auto;padding:0 16px 64px;color:var(--ink);
    font-family:var(--sans);line-height:1.6;-webkit-text-size-adjust:100%}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  header{padding:22px 2px 14px}
  .kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}

  .sub{color:var(--muted);font-size:.9rem;margin:0}
  nav{display:flex;gap:6px;background:var(--raise);border:1px solid var(--line);
    border-radius:var(--radius);padding:5px;position:sticky;top:8px;z-index:5;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);white-space:nowrap;

  .pos{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .term{font-family:var(--serif);font-size:2.3rem;font-weight:600;line-height:1.15;margin:.25rem 0 .1rem;letter-spacing:-.01em;text-wrap:balance}
  .prompt-think{color:var(--muted);font-size:.92rem;margin-top:4px}
  .reveal{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
  .sense{margin:0 0 10px;font-size:1.05rem}
  .eg{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:1.02rem;margin:2px 0 0}
  .flag-note{margin-top:12px;font-size:.82rem;color:var(--muted);background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:8px 10px}

  .def-word:hover{background:var(--accent-tint)}
  .def-word.flag{background:var(--bad-tint);border-bottom:2px solid var(--bad);color:var(--bad)}
  .say{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
  .say .lab{font-family:var(--sans);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .say .phon{font-family:var(--mono);font-size:1rem;font-weight:600;color:var(--accent-strong)}
  .hear{border:1px solid var(--line);background:var(--raise);color:var(--accent-strong);font-family:var(--sans);font-weight:600;font-size:.8rem;padding:5px 11px;border-radius:8px;cursor:pointer}
  .hear:hover{background:var(--accent-tint)} .hear:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .spell{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
  .spell .lab{font-family:var(--sans);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

  .btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}

  .grade .g-green{background:var(--good-tint);border-color:var(--good)}
  .grade .g-yellow{background:var(--warn-tint);border-color:var(--warn)}
  .grade .g-red{background:var(--bad-tint);border-color:var(--bad)}

  .grade button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input[type=text]{width:100%;font-family:var(--mono);font-size:1.15rem;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:var(--raise);color:var(--ink);margin-top:14px}
  input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .verdict{margin-top:14px;font-family:var(--mono);font-size:1.05rem}
  .verdict .ok{color:var(--good)} .verdict .no{color:var(--bad);text-decoration:line-through} .verdict .corr{color:var(--accent-strong);font-weight:600}
  .done{text-align:center;padding:26px 8px}

  .redlist{text-align:left;margin:14px 0 0}
  .chip{display:inline-block;background:var(--bad-tint);color:var(--bad);border-radius:8px;padding:3px 9px;margin:3px 4px 0;font-size:.85rem;font-weight:600}

  .lmenu{display:flex;flex-direction:column;gap:10px}
  .lcard{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;font-family:var(--sans);color:var(--ink)}

  .lcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lnum{width:36px;height:36px;border-radius:10px;background:var(--accent-tint);color:var(--accent-strong);font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--serif);font-size:1.1rem}
  .lt{flex:1;min-width:0}
  .lt .ltag{font-size:.7rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  .lt .lname{font-weight:600;font-size:1.05rem;font-family:var(--serif)}
  .lt .llead{color:var(--muted);font-size:.85rem;margin-top:1px}
  .lchev{color:var(--faint);font-size:1.2rem}
  .lback{background:transparent;border:0;color:var(--accent);font-weight:600;font-size:.92rem;cursor:pointer;padding:4px 2px;margin-bottom:8px;font-family:var(--sans)}
  .lwhy{background:var(--accent-tint);border-radius:10px;padding:12px 14px;font-size:.92rem;color:var(--accent-strong);margin:0 0 14px;line-height:1.5}
  .rule{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 6px}
  .rule h2{font-family:var(--serif);font-size:1.32rem;font-weight:600;margin:0 0 4px}
  .rule p{font-size:.94rem;margin:.4rem 0 .8rem}
  .rule .lead{color:var(--muted)}
  .tbl{overflow-x:auto;margin:0 0 14px}
  table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:340px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
  td code,p code{font-family:var(--mono);font-size:.85em;background:var(--raise);padding:1px 5px;border-radius:5px}
  .x{color:var(--bad);font-weight:600} .ok2{color:var(--good);font-weight:600}
  /* use of english */
  .cloze-sent{font-family:var(--serif);font-size:1.28rem;line-height:1.55;margin:8px 0 2px}
  .cloze-gap{display:inline-block;min-width:74px;border-bottom:2px solid var(--accent);vertical-align:baseline}
  .cloze-why{margin-top:14px;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.92rem;line-height:1.55}
  .cloze-why b{color:var(--accent-strong);font-family:var(--serif)}
  footer{margin-top:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.82rem;color:var(--faint)}
  footer button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 12px;font-family:var(--sans);font-weight:600;font-size:.82rem;cursor:pointer}
  .toast{position:sticky;bottom:14px;margin:14px auto 0;max-width:340px;text-align:center;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 14px;font-size:.86rem;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

   why:"Your #1 leak — and fixing it teaches you clauses, which all of C2 grammar is built on.",
   rows:[["Period","<i>I finished it. I sent it.</i>","separate thoughts"],["Semicolon","<i>I finished it; I sent it.</i>","tightly linked"],["Comma + FANBOYS","<i>I finished it, so I sent it.</i>","show the link"],["Subordinator","<i>After I finished, I sent it.</i>","one depends on other"]],
   note:"FANBOYS = for, and, nor, but, or, yet, so. Self-test: cover the comma — if <b>both</b> sides could stand alone as sentences, a bare comma is wrong."},
  {n:4,tag:"Precision",t:"Reflexive verbs",lead:"myself, yourself — and when NOT to.",
   why:"'I immerse myself', not 'I immerse'. Small word, but its absence sounds off to a native ear.",
   rows:[["immerse yourself in","<i>I immerse <b>myself</b> in English</i>","required"],["pride yourself on","<i>He prides <b>himself</b> on accuracy</i>","required"],["familiarize yourself with","<i>Familiarize <b>yourself</b> with it</i>","required"],["feel / relax","<i>I feel tired</i> <span class='x'>not</span> <i>I feel myself tired</i>","don't add one"]],
   note:"Some verbs need the reflexive; many already carry the meaning and adding 'myself' is a common error. For emphasis it's fine: <i>I did it <b>myself</b></i>."},
  {n:5,tag:"Speaking",t:"Pronunciation & silent letters",lead:"Say it right, sound sure.",
   why:"A mispronounced word makes a fluent speaker sound unsure. Stress and silent letters are the traps.",
   rows:[["Silent b","su<b>b</b>tle, dou<b>b</b>t, com<b>b</b>","written, not said"],["Silent k","<b>k</b>now, <b>k</b>nee, <b>k</b>nife","the k is silent"],["Silent gh","thorou<b>gh</b>, thou<b>gh</b>, hi<b>gh</b>","not pronounced"],["Stress flips meaning","<b>RE</b>cord (noun) / re<b>CORD</b> (verb)","move the stress"]],
   note:"We write sounds in CAPS for the stressed part — <i>nuance → NEW-ahnss</i>, <i>subtle → SUT-ul</i> — no strange symbols."},
  {n:6,tag:"Foundation",t:"Present perfect vs past",lead:"'I did' vs 'I have done'.",
   why:"The mix-up that most marks a non-native — English cares a lot whether the time is finished.",
   rows:[["Past simple","<i>I sent it yesterday.</i>","finished time (said or clear)"],["Present perfect","<i>I have sent it.</i>","no time given / still relevant now"],["Signal words","ago, yesterday, in 2020 → <b>past</b>","already, yet, ever, since → <b>perfect</b>"]],
   note:"If the time is finished and stated, use past simple. If it connects to now, or no time is given, use present perfect."}
];

// Use of English — the precise word. Built from Гриша's 'quarrel vs reason' insight:
// the word you reach for feels close but isn't the one. 'answer' is the target; 'accept'
// are weaker words he might reach for; 'why' teaches the precision.
const CLOZE = [
  {text:"He would ___ with anyone over the smallest thing.",answer:"quarrel",accept:["argue","bicker","fight"],hint:"a small, angry argument",
   why:"to argue angrily about something small or petty. You reached for 'reason' — but reason is about logic or cause, not fighting. They only *felt* close."},
  {text:"We put a plan in place to ___ the risk of default.",answer:"mitigate",accept:["reduce","lessen","lower"],hint:"make something bad less severe",
   why:"to make something bad less severe. 'reduce' is close but plainer; 'mitigate' is the precise, professional word for softening a risk or harm."},
  {text:"She is ___ about every detail in the report.",answer:"meticulous",accept:["careful","thorough","precise"],hint:"extremely careful and precise",
   why:"extremely careful and precise about detail. 'careful' is weaker; 'meticulous' carries the intensity."},
  {text:"Keep the email ___ — no wasted words.",answer:"concise",accept:["short","brief","tight"],hint:"short AND clear, nothing wasted",
   why:"short and clear with nothing wasted. 'short' is only about length; 'concise' adds 'and every word earns its place' — your north star."},
  {text:"He was ___ to take on any more work.",answer:"reluctant",accept:["unwilling","hesitant"],hint:"not really wanting to",
   why:"unwilling, holding back. One precise word for 'he didn't really want to'."},
  {text:"With that workload, burnout was ___.",answer:"inevitable",accept:["unavoidable","certain","coming"],hint:"certain, impossible to avoid",
   why:"certain to happen and impossible to avoid. Tighter and stronger than 'it was going to happen'."}
];

const KEY="english-study-v2";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
state.meaning=state.meaning||{}; state.spelling=state.spelling||{}; state.flagged=state.flagged||{}; state.cloze=state.cloze||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const $=id=>document.getElementById(id);
let mi=0,si=0,ui=0;

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100);}

function speak(word){
  if(!("speechSynthesis" in window)){toast("This browser can't speak — use the respelling");return;}
  const clean=word.replace(/\s*\/\s*/g,", ");
  const u=new SpeechSynthesisUtterance(clean);
  u.lang="en-GB"; u.rate=0.9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
// Written spelling, e.g. "holistic" -> "h·o·l·i·s·t·i·c" (pairs split on '/').
function spellDisplay(term){
  return term.split("/").map(w=>w.trim().split("").join("·")).join("  /  ");
}
// Speak the letters one by one, slowly.
function spellAloud(term){
  if(!("speechSynthesis" in window)){toast("This browser can't speak — read the letters");return;}
  const s=term.split("/").map(w=>w.trim().toUpperCase().split("").join(", ")).join(".  ");
  const u=new SpeechSynthesisUtterance(s);
  u.lang="en-GB"; u.rate=0.6;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function fmtText(text){
  if(text.indexOf("<")>-1) return text;
  return text.split(/(\s+)/).map(part=>{
    if(part===""||/^\s+$/.test(part)) return part;
    const m=part.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'’\-]*)([^A-Za-z]*)$/);
    if(!m) return part;
    const pre=m[1],word=m[2],post=m[3];
    const key=word.toLowerCase().replace(/[’']s$/,"");
    const g=GLOSS[key];
    if(word.length<3 && !g) return part;
    const fl=state.flagged[key]?" flag":"";
    return pre+`<span class="def-word${g?" hasgloss":""}${fl}" data-w="${key}"${g?` data-g="${g.replace(/"/g,"&quot;")}"`:""}>${word}</span>`+post;
  }).join("");
}
function wireWords(root){
  root.querySelectorAll(".def-word").forEach(sp=>sp.onclick=()=>{
    const key=sp.dataset.w;
    const on=!state.flagged[key];
    if(on) state.flagged[key]={g:sp.dataset.g||""}; else delete state.flagged[key];
    save(); sp.classList.toggle("flag",on); renderTray();
  });
}
function renderTray(){
  const tray=$("m-tray"); if(!tray) return;
  const keys=Object.keys(state.flagged);
  tray.innerHTML=keys.map(k=>{
    const g=state.flagged[k].g;
    return `<div class="row"><b>${k}</b> — ${g?`<span class="g">${g}</span>`:`<span class="ask">on your list — Claude explains this deeply next class</span>`}</div>`;
  }).join("");
}

function renderMeaning(){
  const c=VOCAB[mi];
  const graded=Object.keys(state.meaning).length;
  $("m-count").textContent=`Card ${mi+1} of ${VOCAB.length}`;
  $("m-known").textContent=graded?`${graded} rated`:"—";
  $("m-meter").style.width=(graded/VOCAB.length*100)+"%";
  const prev=state.meaning[c.w];
  const senses=c.senses.map(s=>`<p class="sense">${c.senses.length>1?"&bull; ":""}${fmtText(s)}</p>`).join("");
  $("m-slot").innerHTML=`
    <div class="card ${prev?("mark-"+prev):""}" id="m-card">
      <div class="pos">${c.pos}</div>
      <div class="term">${c.w}</div>
      <div class="prompt-think" id="m-think">Do you know what this means? Think it through, then reveal.</div>
      <div id="m-reveal" hidden>
        <div class="reveal">${SAY[c.w]?`<div class="say"><span class="lab">say it</span><span class="phon">${SAY[c.w]}</span><button class="hear" id="m-hear" type="button" aria-label="Hear it pronounced">&#128266; Hear it</button></div>`:""}<div class="spell"><span class="lab">spell it</span><span class="letters">${spellDisplay(c.w)}</span><button class="hear" id="m-spell" type="button" aria-label="Spell it aloud">&#128266; Spell it</button></div>${senses}<p class="eg">&ldquo;${fmtText(c.eg)}&rdquo;</p>${c.flag?`<div class="flag-note">${c.flag}</div>`:""}</div>
        <div class="tap-hint">&#9755; Tap any word you don't know — even in the explanation.</div>
        <div class="tray" id="m-tray"></div>
        <div class="grade">
          <button class="g-green" data-g="green"><span class="dot"></span>Knew it<small>solid</small></button>
          <button class="g-yellow" data-g="yellow"><span class="dot"></span>Roughly<small>fuzzy</small></button>
          <button class="g-red" data-g="red"><span class="dot"></span>New to me<small>study it</small></button>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="m-btn">Reveal meaning</button>
    </div>`;
  $("m-btn").onclick=()=>{$("m-reveal").hidden=false;$("m-btn").hidden=true;$("m-think").textContent="How close were you? Tap words you don't know.";};
  wireWords($("m-slot")); renderTray();
  const hb=$("m-hear"); if(hb) hb.onclick=()=>speak(c.w);
  const sb=$("m-spell"); if(sb) sb.onclick=()=>spellAloud(c.w);
  $("m-slot").querySelectorAll(".grade button").forEach(b=>b.onclick=()=>{
    state.meaning[c.w]=b.dataset.g;save();
    $("m-card").className="card mark-"+b.dataset.g;
    setTimeout(()=>{ if(mi<VOCAB.length-1){mi++;renderMeaning();} else meaningDone(); },260);
  });
}
function meaningDone(){
  const reds=VOCAB.filter(c=>state.meaning[c.w]==="red").map(c=>c.w);
  const yel=VOCAB.filter(c=>state.meaning[c.w]==="yellow").map(c=>c.w);
  const green=VOCAB.filter(c=>state.meaning[c.w]==="green").length;
  const dug=Object.keys(state.flagged);
  $("m-known").textContent=`${VOCAB.length} rated`;$("m-meter").style.width="100%";
  $("m-slot").innerHTML=`<div class="card done">
    <h3>Deck complete</h3>
    <p class="sub">${green} solid &middot; ${yel.length} fuzzy &middot; ${reds.length} new</p>
    ${reds.length?`<div class="redlist"><div class="pos">Study these next</div>${reds.map(w=>`<span class="chip">${w}</span>`).join("")}</div>`:""}
    ${yel.length?`<div class="redlist"><div class="pos">Firm these up</div>${yel.map(w=>`<span class="chip y">${w}</span>`).join("")}</div>`:""}
    ${dug.length?`<div class="redlist"><div class="pos">Words you tapped to dig into</div>${dug.map(w=>`<span class="chip">${w}</span>`).join("")}</div>`:""}
    <button class="btn ghost" id="m-again">Go through again</button>
  </div>`;
  $("m-again").onclick=()=>{mi=0;renderMeaning();};
}

function renderSpelling(){
  const c=SPELL[si];
  const graded=Object.keys(state.spelling).length;
  $("s-count").textContent=`Word ${si+1} of ${SPELL.length}`;
  $("s-known").textContent=graded?`${graded} done`:"—";
  $("s-meter").style.width=(graded/SPELL.length*100)+"%";
  $("s-slot").innerHTML=`
    <div class="card" id="s-card">
      <div class="pos">Type the word</div>
      <div class="prompt-think" style="font-size:1.05rem;color:var(--ink);margin-top:6px">${c.hint}</div>
      <input type="text" id="s-input" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="your spelling…" aria-label="Type the word">
      <div id="s-verdict"></div>
      <div class="spacer"></div>
      <button class="btn" id="s-btn">Check</button>
    </div>`;
  const input=$("s-input");input.focus();
  input.onkeydown=e=>{if(e.key==="Enter")$("s-btn").click();};
  $("s-btn").onclick=()=>{
    const val=input.value.trim();
    if(!val)return;
    const ok=val.toLowerCase()===c.a.toLowerCase();
    state.spelling[c.a]=ok?"green":"red";save();
    $("s-verdict").innerHTML=ok
      ? `<div class="verdict"><span class="ok">&check; ${c.a}</span></div>`
      : `<div class="verdict"><span class="no">${val}</span> &rarr; <span class="corr">${c.a}</span></div>`;
    $("s-card").className="card mark-"+(ok?"green":"red");
    input.disabled=true;
    const btn=$("s-btn");btn.textContent=si<SPELL.length-1?"Next word":"Finish";
    btn.onclick=()=>{ if(si<SPELL.length-1){si++;renderSpelling();} else spellingDone(); };
  };
}
function spellingDone(){
  const missed=SPELL.filter(c=>state.spelling[c.a]==="red").map(c=>c.a);
  const right=SPELL.length-missed.length;
  $("s-known").textContent=`${SPELL.length} done`;$("s-meter").style.width="100%";
  $("s-slot").innerHTML=`<div class="card done">
    <h3>${right} / ${SPELL.length} correct</h3>
    ${missed.length?`<div class="redlist"><div class="pos">Re-drill these</div>${missed.map(w=>`<span class="chip">${w}</span>`).join("")}</div>`:`<p class="sub">Clean sweep. This set is retired for now.</p>`}
    <button class="btn ghost" id="s-again">Go again</button>
  </div>`;
  $("s-again").onclick=()=>{si=0;renderSpelling();};
}

/* ---- Lessons: a structured, navigable library ---- */
function renderLessons(){
  const items=LESSONS.map((l,i)=>`<button class="lcard" data-i="${i}">
      <span class="lnum">${l.n}</span>
      <span class="lt"><span class="ltag">${l.tag}</span><span class="lname">${l.t}</span><span class="llead">${l.lead}</span></span>
      <span class="lchev">›</span>
    </button>`).join("");
  $("l-slot").innerHTML=`<p class="sub" style="margin:0 2px 12px">Your curriculum — tap a lesson to open it.</p><div class="lmenu">${items}</div>`;
  $("l-slot").querySelectorAll(".lcard").forEach(b=>b.onclick=()=>openLesson(+b.dataset.i));
}
function openLesson(i){
  const l=LESSONS[i];
  $("l-slot").innerHTML=`<button class="lback" id="l-back">&lsaquo; All lessons</button>
    <div class="rule">
      <div class="ltag" style="color:var(--accent);margin-bottom:2px">${l.tag} &middot; Lesson ${l.n}</div>
      <h2>${l.t}</h2>
      <p class="lead">${l.lead}</p>
      ${l.why?`<div class="lwhy">${l.why}</div>`:""}
      ${l.rows?`<div class="tbl"><table><tbody>${l.rows.map(r=>`<tr>${r.map((cell,j)=>j===0?`<th scope="row" style="text-transform:none;color:var(--ink);font-size:.86rem;letter-spacing:0">${cell}</th>`:`<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
      ${l.note?`<p>${l.note}</p>`:""}
    </div>`;
  $("l-back").onclick=()=>renderLessons();
  $("p-lessons").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---- Use of English: fill the gap with the precise word ---- */
function renderUse(){
  const c=CLOZE[ui];
  const done=Object.keys(state.cloze).length;
  $("u-count").textContent=`Sentence ${ui+1} of ${CLOZE.length}`;
  $("u-known").textContent=done?`${done} practised`:"—";
  $("u-meter").style.width=(done/CLOZE.length*100)+"%";
  const sentence=c.text.replace("___",'<span class="cloze-gap">&nbsp;</span>');
  $("u-slot").innerHTML=`
    <div class="card" id="u-card">
      <div class="pos">Fill the gap — the precise word</div>
      <p class="cloze-sent">${sentence}</p>
      ${c.hint?`<div class="prompt-think">meaning: ${c.hint}</div>`:""}
      <input type="text" id="u-input" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" placeholder="the word that fits…" aria-label="Type the word">
      <div id="u-verdict"></div>
      <div class="spacer"></div>
      <button class="btn" id="u-btn">Check</button>
    </div>`;
  const input=$("u-input"); input.focus();
  input.onkeydown=e=>{if(e.key==="Enter")$("u-btn").click();};
  $("u-btn").onclick=()=>submitCloze(c,input);
}
function submitCloze(c,input){
  const val=input.value.trim();
  if(!val)return;
  const low=val.toLowerCase();
  const exact=low===c.answer.toLowerCase();
  const near=(c.accept||[]).map(a=>a.toLowerCase()).includes(low);
  let verdict;
  if(exact) verdict=`<span class="ok">&check; ${c.answer}</span> — spot on.`;
  else if(near) verdict=`<span class="corr">${val}</span> works, but the sharper word is <span class="corr">${c.answer}</span>.`;
  else verdict=`<span class="no">${val}</span> &rarr; the word is <span class="corr">${c.answer}</span>.`;
  $("u-verdict").innerHTML=`<div class="verdict">${verdict}</div>
    <div class="cloze-why"><b>${c.answer}</b> — ${c.why}</div>
    <div class="grade" id="u-grade">
      <button class="g-green" data-g="green"><span class="dot"></span>Had it<small>solid</small></button>
      <button class="g-yellow" data-g="yellow"><span class="dot"></span>Close<small>fuzzy</small></button>
      <button class="g-red" data-g="red"><span class="dot"></span>Missed<small>practise</small></button>
    </div>`;
  input.disabled=true;
  $("u-card").className="card mark-"+(exact?"green":near?"yellow":"red");
  $("u-btn").hidden=true;
  $("u-grade").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    state.cloze[c.answer]={rating:b.dataset.g,why:c.why,ts:Date.now()}; save();
    if(ui<CLOZE.length-1){ui++;renderUse();} else useDone();
  });
}
function useDone(){
  const words=Object.keys(state.cloze);
  const practise=words.filter(w=>state.cloze[w].rating!=="green");
  $("u-known").textContent=`${words.length} practised`;$("u-meter").style.width="100%";
  $("u-slot").innerHTML=`<div class="card done">
    <h3>Set complete</h3>
    <p class="sub">${words.length} precise words worked</p>
    ${practise.length?`<div class="redlist"><div class="pos">Add these to practice</div>${practise.map(w=>`<span class="chip">${w}</span>`).join("")}</div>`:`<p class="sub">All sharp. Nice.</p>`}
    <button class="btn ghost" id="u-again">Go again</button>
  </div>`;
  $("u-again").onclick=()=>{ui=0;renderUse();};
}

const tabs=[["tab-meaning","p-meaning"],["tab-spelling","p-spelling"],["tab-lessons","p-lessons"],["tab-use","p-use"]];
tabs.forEach(([tab,pan])=>{
  $(tab).onclick=()=>{
    tabs.forEach(([t,p])=>{$(t).setAttribute("aria-selected",t===tab);$(p).hidden=(p!==pan);});
    if(pan==="p-spelling"&&$("s-input"))$("s-input").focus();
    if(pan==="p-use"&&$("u-input"))$("u-input").focus();
  };
});

$("export").onclick=()=>{
  const mr=VOCAB.filter(c=>state.meaning[c.w]==="red").map(c=>c.w);
  const my=VOCAB.filter(c=>state.meaning[c.w]==="yellow").map(c=>c.w);
  const sm=SPELL.filter(c=>state.spelling[c.a]==="red").map(c=>c.a);
  const dug=Object.keys(state.flagged);
  const cw=Object.keys(state.cloze).filter(w=>state.cloze[w].rating!=="green");
  const d=new Date().toISOString().slice(0,10);
  const txt=`English study results — ${d}\n`+
    `Meaning · new to me (red): ${mr.join(", ")||"none"}\n`+
    `Meaning · fuzzy (yellow): ${my.join(", ")||"none"}\n`+
    `Spelling · missed: ${sm.join(", ")||"none"}\n`+
    `Words I tapped inside explanations (go deeper): ${dug.join(", ")||"none"}\n`+
    `Use of English · precise words to practise: ${cw.join(", ")||"none"}\n`+
    `Please explain the tapped words simply, add every one to my word bank with all senses, and build my next class around these.`;
  navigator.clipboard.writeText(txt).then(()=>toast("Copied — paste it to Claude"),()=>toast("Copy failed — long-press to select"));
};
$("reset").onclick=()=>{if(confirm("Clear all your ratings and tapped words?")){state={meaning:{},spelling:{},flagged:{},cloze:{}};save();mi=0;si=0;ui=0;renderMeaning();renderSpelling();renderUse();toast("Progress cleared");}};
$("theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme",next);
};

renderMeaning();renderSpelling();renderLessons();renderUse();
</script>
