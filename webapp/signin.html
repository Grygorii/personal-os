<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kept — sign in</title>
<meta name="theme-color" content="#14130F">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{--paper:#14130F;--surface:#1D1B16;--ink:#ECE8DF;--muted:#9C9686;--faint:#6E695C;
    --line:#2C2A22;--accent:#D9AE4A;
    --serif:"Iowan Old Style",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .card{max-width:380px;width:100%;text-align:center}
  .logo{font-family:var(--serif);color:var(--accent);font-size:1.1rem;margin-bottom:30px}
  h1{font-family:var(--serif);font-size:1.85rem;font-weight:600;margin:0 0 10px;line-height:1.2}
  p.sub{color:var(--muted);margin:0 0 30px}
  .widget{display:flex;justify-content:center;min-height:48px}
  .err{color:#E1685C;font-size:.9rem;min-height:1.2em;margin-top:16px}
  .note{color:var(--faint);font-size:.84rem;margin-top:16px}
  .foot{color:var(--faint);font-size:.78rem;margin-top:34px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">📕 Kept</div>
    <h1>Sign in to your library</h1>
    <p class="sub">Your books, thoughts and exam results — on any device.</p>

    <!--GOOGLE-->
    <div class="widget"><div id="g-btn"></div></div>
    <div class="err" id="err"></div>
    <p class="note">One tap. No password to invent, nothing to install.</p>
    <!--/GOOGLE-->

    <!--NOGOOGLE-->
    <p class="note">Sign-in isn't configured on this server yet — try again shortly.</p>
    <!--/NOGOOGLE-->

    <div class="foot">Read it. Prove you kept it.<br>
      <a href="/privacy" style="color:var(--faint)">What we store</a></div>

    <!--GOOGLE-->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      // Google returns an ID token in the browser; the server verifies it (including that
      // it was minted for THIS app) before trusting anything.
      function onGoogleCredential(resp) {
        fetch('/auth/google', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ credential: resp.credential }),
        })
          .then(function (r) {
            if (r.ok) { location.replace('/app'); return; }
            return r.json().then(function (d) {
              document.getElementById('err').textContent =
                d.error === 'not_invited' || d.error === 'waiting'
                  ? 'Kept is in a small closed beta right now — ask Grisha to let you in.'
                  : "That sign-in didn't work. Try again.";
            });
          })
          .catch(function () { document.getElementById('err').textContent = 'Network problem — try again.'; });
      }
      window.addEventListener('load', function () {
        if (!window.google || !'GOOGLE_CLIENT_ID') return;
        try {
          google.accounts.id.initialize({ client_id: 'GOOGLE_CLIENT_ID', callback: onGoogleCredential });
          google.accounts.id.renderButton(document.getElementById('g-btn'), {
            theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', width: 260,
          });
        } catch (e) {}
      });
    </script>
    <!--/GOOGLE-->
  </div>
</body>
</html>
