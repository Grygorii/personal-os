<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Colour means ONE thing here and never decorates: green is money arriving or owned, red is
     money leaving or owed. Nothing else is allowed either colour, so a red number is always
     bad news and never a highlight.
     Telegram supplies the surrounding theme, so the palette is built on its variables and
     falls back to a dark set when opened outside Telegram. */
  :root{
    --bg: var(--tg-theme-bg-color, #17181c);
    --card: var(--tg-theme-secondary-bg-color, #1f2126);
    --ink: var(--tg-theme-text-color, #eceef2);
    --dim: var(--tg-theme-hint-color, #8b8f99);
    --line: #2c2f36;
    --in: #3ecf8e;      --in-bg: rgba(62,207,142,.12);
    --out: #f0616d;     --out-bg: rgba(240,97,109,.12);
    --accent: var(--tg-theme-button-color, #3ecf8e);
    --on-accent: var(--tg-theme-button-text-color, #06281a);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:96px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:14px}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:2px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:16px;position:sticky;top:8px;z-index:5}
  .tab{flex:1;border:0;background:none;color:var(--dim);font:600 12px/1 inherit;padding:11px 1px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--bg);color:var(--ink)}
  .panel[hidden]{display:none}

  .card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  h2{font-size:13px;font-weight:600;color:var(--dim);margin:0 0 10px;letter-spacing:.03em;text-transform:uppercase}

  .big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .in{color:var(--in)} .out{color:var(--out)}

  .split{display:flex;gap:10px}
  .split>div{flex:1;background:var(--card);border-radius:14px;padding:14px 16px}
  .split .amt{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}

  /* ---- Rows ---- */
  .row{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  /* Green and red are ΔE 7.7 apart for deuteranopia — the commonest colour blindness, and
     exactly the pair this app is built on. Measured, not guessed: the palette validator flags
     it as legal only WITH a secondary encoding. So colour never carries meaning alone here:
     money in is a filled dot and always prefixed "+", money out is a hollow ring and always
     "−". Either signal alone is enough to read the page. */
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .dot.in{background:var(--in)}
  .dot.out{background:transparent;border:2.5px solid var(--out)}
  .rmain{flex:1;min-width:0}
  .rlabel{font-weight:500}
  .rmeta{color:var(--dim);font-size:12px;margin-top:1px}
  .ramt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .rorig{display:block;color:var(--dim);font-size:11px;font-weight:400}
  /* 44px is the smallest thing a thumb hits reliably; these were 17px of glyph with 2px of
     padding, and the DESTRUCTIVE one sat directly beside the everyday one. Both are now real
     targets, and delete is pushed to the far edge with a gap between them. */
  .del,.edit{border:0;background:none;color:var(--dim);font-size:17px;line-height:1;cursor:pointer;
    flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .del{color:var(--dim);margin-left:2px}
  .del:active{background:var(--out-bg);color:var(--out)}
  .edit:active{background:var(--line)}

  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--in-bg);color:var(--in)}
  .pill.out{background:var(--out-bg);color:var(--out)}
  /* A projection is not a record, and must never look like one. */
  .pill.sched{background:var(--line);color:var(--dim)}

  /* ---- Where passive income comes from ----
     Rent from a flat he owns and interest from a certificate that matures in 2027 are not the
     same progress towards the goal, and one green bar says they are. Three hues, in a FIXED
     order per source so a colour never moves when a source appears or disappears.

     Taken from the reference categorical palette and run through its validator against this
     app's own card colour, all-pairs, in both modes: worst CVD ΔE 9.4 dark / 9.2 light, worst
     normal-vision ΔE 20.9 dark / 24.0 light. Not eyeballed.

     Two of the light steps sit under 3:1 on a light surface, which obliges relief — so every
     segment is also named and given its amount in the legend below the bar. Colour never
     carries identity alone here, same rule as the rest of the app. */
  :root{
    --src-1:#199e70;   /* rent      */
    --src-2:#3987e5;   /* interest  */
    --src-3:#d95926;   /* dividend  */
    --src-4:#8b8f99;   /* anything else */
  }
  @media (prefers-color-scheme: light){
    :root{ --src-1:#1baf7a; --src-2:#2a78d6; --src-3:#eb6834; --src-4:#6b6f79; }
  }
  /* A 2px gap of track between fills, so two segments never read as one long bar. */
  .meter{display:flex;gap:2px;height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
  .meter>i{display:block;height:100%;border-radius:5px;min-width:3px}
  /* ARRIVED versus STILL COMING, told apart by TEXTURE and not by another hue.
     On the 2nd of the month no certificate has paid a coupon yet, so a bar of only what landed
     shows one flat and nothing else — which is not the shape of his income. But money that has
     not arrived must never look like money that has. Same colour, so the source is still
     readable; hatched and half-opaque, so the difference survives being colour-blind, printed,
     or looked at quickly. Only the solid part is in the headline figure. */
  .meter>i.coming{
    opacity:.55;
    background-image:repeating-linear-gradient(135deg,
      rgba(0,0,0,0) 0 3px, rgba(0,0,0,.45) 3px 6px);
  }
  .swatch.coming{opacity:.55;background-image:repeating-linear-gradient(135deg,
      rgba(0,0,0,0) 0 2px, rgba(0,0,0,.45) 2px 4px)}
  .legend{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .legend>div{display:flex;align-items:center;gap:8px;font-size:13px}
  .swatch{width:10px;height:10px;border-radius:3px;flex:none}
  .legend .lname{flex:1;min-width:0;text-transform:capitalize}
  .legend .lamt{font-variant-numeric:tabular-nums;font-weight:600}

  /* ---- Bars ---- */
  .bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:var(--in);border-radius:5px}
  /* Progress through a DEBT is not progress in the same direction as progress through a
     deposit, and it must not be painted as though it were. */
  .bar>i.owed{background:var(--out)}
  .catbar{height:6px;border-radius:4px;background:var(--out);opacity:.85;margin-top:6px}

  .warn{background:var(--out-bg);border-left:3px solid var(--out);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.5}
  .note{color:var(--dim);font-size:12px;line-height:1.5;margin-top:10px}
  .empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:14px}

  /* ---- Add ---- */
  /* Bottom RIGHT, not centred. Centred, it sat squarely on top of the middle of whatever row was
     under it — the part of a line that carries the words. In the corner it covers a margin. */
  .fab{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));
    background:var(--accent);color:var(--on-accent);border:0;border-radius:26px;height:50px;padding:0 22px;
    font:700 15px/1 inherit;box-shadow:0 6px 22px rgba(0,0,0,.45);cursor:pointer;z-index:20}
  @media (min-width:668px){ .fab{right:calc(50% - 320px + 14px)} }
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end}
  .sheet[hidden]{display:none}
  .sheetbox{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
  input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    font:16px/1 inherit;padding:13px 14px;margin-bottom:10px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .btn{width:100%;background:var(--accent);color:var(--on-accent);border:0;border-radius:11px;height:46px;font:700 15px/1 inherit;cursor:pointer}
  .btn.ghost{background:none;color:var(--dim);border:1px solid var(--line);margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:16px;color:var(--dim);font:12px/1 inherit;padding:8px 11px;cursor:pointer}
  .err{color:var(--out);font-size:13px;margin-bottom:10px}

  /* ---- The year along the top ----
     Twelve months side by side, because the only way to know whether this month is bad is to
     see the eleven before it. Scrolls horizontally INSIDE itself — the page body must never
     scroll sideways on a phone. */
  .months{position:relative;display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
  .months::-webkit-scrollbar{display:none}
  .mchip{flex:none;background:var(--card);border:1.5px solid transparent;border-radius:12px;
    padding:7px 12px;min-width:76px;text-align:center;cursor:pointer;color:var(--dim);font:inherit}
  .mchip.on{border-color:var(--accent);color:var(--ink)}
  .mchip .mname{display:block;font-size:13px;font-weight:600}
  .mchip .msum{display:block;font-size:11px;font-variant-numeric:tabular-nums;margin-top:2px}
  .mchip.blank{opacity:.42}

  /* ---- Editing ---- */
  .field{margin-bottom:10px}
  .field>label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;
    color:var(--ink);font:16px/1.2 inherit;padding:12px 13px}
  .two{display:flex;gap:8px}
  .two>.field{flex:1}
  .seg{display:flex;gap:6px}
  .seg button{flex:1;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;color:var(--dim);
    font:600 14px/1 inherit;padding:12px 4px;cursor:pointer}
  .seg button.on{border-color:var(--accent);color:var(--ink)}
  .sheetbox h3{font-size:15px;margin:0 0 12px;font-weight:600}
  .scroller{max-height:70vh;overflow-y:auto}

  /* While a request is in flight. Without this a tapped month looks like a tap that did
     nothing, and he taps it again. */
  body.busy .panel{opacity:.5;pointer-events:none}
  body.busy .fab{opacity:.5;pointer-events:none}
  .todo{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .todo:first-of-type{border-top:0}
  .todo .add{flex:none;background:var(--bg);border:1.5px solid var(--accent);color:var(--ink);
    border-radius:10px;font:600 13px/1 inherit;padding:9px 13px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab on" data-tab="month" role="tab">Month</button>
    <button class="tab" data-tab="worth" role="tab">Worth</button>
    <button class="tab" data-tab="subs" role="tab">Subs</button>
    <button class="tab" data-tab="goal" role="tab">Goal</button>
    <button class="tab" data-tab="plan" role="tab">Plan</button>
    <button class="tab" data-tab="fx" role="tab">Rates</button>
  </div>

  <div class="panel" id="p-month"></div>
  <div class="panel" id="p-worth" hidden></div>
  <div class="panel" id="p-subs" hidden></div>
  <div class="panel" id="p-goal" hidden></div>
  <div class="panel" id="p-plan" hidden></div>
  <div class="panel" id="p-fx" hidden></div>
</div>

<button class="fab" id="fab">+  Add</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheetbox">
    <div class="err" id="err" hidden></div>
    <input type="text" id="entry" placeholder="out 40 food" autocomplete="off" autocapitalize="off">
    <div class="chips" id="chips"></div>
    <button class="btn" id="save">Save</button>
    <button class="btn ghost" id="cancel">Cancel</button>
  </div>
</div>

<!-- Correcting something already recorded. Real fields, not the one-line grammar: retyping the
     line to fix a typo makes a second entry, and a tracker that double-counts is worse than one
     that was wrong once. -->
<div class="sheet" id="esheet" hidden>
  <div class="sheetbox">
    <div class="scroller">
      <h3 id="etitle">Edit</h3>
      <div class="err" id="eerr" hidden></div>
      <div id="efields"></div>
    </div>
    <button class="btn" id="esave">Save changes</button>
    <button class="btn ghost" id="ecancel">Cancel</button>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

let S = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money = (n, cur) => n == null ? '—'
  : (n < 0 ? '−' : '') + Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0}) + ' ' + (cur || S.base);

// Which month is on screen. null means "the one he is in", so the app opens on today without
// having to know today's date before the first answer comes back.
let viewMonth = null;

// Telegram's own dialogs where they exist. A browser confirm() inside a Mini App looks like a
// web page that escaped, and on some clients it is easy to dismiss by accident — which for the
// delete button is the wrong accident to make easy.
const ask = (q) => new Promise((resolve) => {
  if (tg?.showConfirm) tg.showConfirm(q, (ok) => resolve(!!ok));
  else resolve(window.confirm(q));
});
const tell = (msg) => { if (tg?.showAlert) tg.showAlert(String(msg)); else window.alert(msg); };

// One request at a time, and the page says so. Without this a tapped month reads as a tap that
// did nothing and he taps it again — which is how two identical entries get recorded.
let busy = false;
async function work(fn) {
  if (busy) return false;
  busy = true; document.body.classList.add('busy');
  try { S = await fn(); draw(); return true; }
  catch (err) { tell(err.message); return false; }
  finally { busy = false; document.body.classList.remove('busy'); }
}

async function api(path, body) {
  // The month travels on EVERY call, including the writes: an edit made while looking at August
  // has to redraw August, not silently jump the view back to today.
  if (viewMonth) path += (path.includes('?') ? '&' : '?') + 'month=' + encodeURIComponent(viewMonth);
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function draw() {
  if (!S.ratesAvailable) {
    const msg = '<div class="card"><div class="empty">Exchange rates are unreachable, so nothing is totalled. Numbers you have entered are safe — this only affects the view.</div></div>';
    for (const name of TABS) $('p-' + name).innerHTML = msg;
    return;
  }
  drawMonth(); drawWorth(); drawSubs(); drawGoal(); drawPlan(); drawFx();
}

const dd = (ms) => new Date(ms).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
const monthName = (from, opts) => new Date(from).toLocaleDateString(undefined, opts || { month: 'short' });
const thisYear = new Date().getUTCFullYear();

/* The strip of months along the top.
   Every month in the window is drawn, including the ones with nothing in them — a month
   quietly missing from the row reads as a month that did not happen, when what it means is a
   month nothing was recorded in, and those are opposite messages. The empty ones are dimmed
   instead. */
function drawMonthStrip() {
  const here = S.monthKey;
  return `<div class="months" id="months">${(S.months || []).map((mo) => {
    const yr = new Date(mo.from).getUTCFullYear();
    const surplus = mo.entries ? `<span class="msum ${mo.surplus >= 0 ? 'in' : 'out'}">${mo.surplus >= 0 ? '+' : '−'}${Math.abs(Math.round(mo.surplus)).toLocaleString()}</span>`
      : '<span class="msum">—</span>';
    return `<button class="mchip ${mo.key === here ? 'on' : ''} ${mo.entries ? '' : 'blank'}" data-month="${esc(mo.key)}">
      <span class="mname">${esc(monthName(mo.from))}${yr !== thisYear ? ' ’' + String(yr).slice(2) : ''}</span>
      ${surplus}
    </button>`;
  }).join('')}</div>`;
}

function drawMonth() {
  const m = S.month;
  const showing = monthName(S.monthFrom, { month: 'long', year: 'numeric' });
  const rows = S.flows.slice(0, 60).map((f) => `
    <div class="row">
      <span class="dot ${f.dir === 'in' ? 'in' : 'out'}"></span>
      <div class="rmain">
        <div class="rlabel">${esc(f.scheduled ? f.label : (f.category || 'uncategorised'))}${f.passive ? ' <span class="pill">passive</span>' : ''}${f.scheduled ? ' <span class="pill sched">scheduled</span>' : ''}</div>
        <div class="rmeta">${new Date(f.ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})}${f.recurring ? ' · repeats' : ''}${
          f.scheduled && f.principalPart != null ? ` · ${Math.round(f.interestPart).toLocaleString()} interest, ${Math.round(f.principalPart).toLocaleString()} off the debt` : ''}${
          f.scheduled && f.estimated ? ' · estimated' : ''}</div>
      </div>
      <div class="ramt ${f.dir === 'in' ? 'in' : 'out'}">${f.dir === 'in' ? '+' : '−'}${money(f.inBase)}
        ${f.currency !== S.base ? `<span class="rorig">${esc(Math.round(f.amount).toLocaleString())} ${esc(f.currency)}</span>` : ''}
      </div>
      ${f.scheduled
        ? `<button class="edit" data-confirm="${esc(f.schedId)}" title="Confirm this went through" aria-label="Confirm">✓</button>`
        : `<button class="edit" data-edit="flow" data-id="${esc(f.id)}" aria-label="Edit">✎</button>
           <button class="del" data-del="flow" data-id="${esc(f.id)}" aria-label="Remove">×</button>`}
    </div>`).join('');

  /* Still to come before the month is out.
     Deliberately NOT in In / Out / Left over. A charge that has not happened folded into those
     turns the record of a month into a forecast of one, and then "left over" means two different
     things depending on the date. It gets its own line and its own projected total instead. */
  const up = S.upcoming || { rows: [] };
  const upcoming = !up.rows.length ? '' : `
    <div class="card"><h2>Still due this month</h2>
      ${up.rows.map((f) => `<div class="row">
        <span class="dot ${f.dir === 'in' ? 'in' : 'out'}"></span>
        <div class="rmain"><div class="rlabel">${esc(f.label)}</div>
          <div class="rmeta">${new Date(f.ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' })}</div></div>
        <div class="ramt ${f.dir === 'in' ? 'in' : 'out'}">${f.dir === 'in' ? '+' : '−'}${money(f.inBase)}</div>
      </div>`).join('')}
      <div class="note">Not in the totals above — those count what has actually moved.
      After these, the month ends at <b class="${up.surplusAfter >= 0 ? 'in' : 'out'}">${money(up.surplusAfter)}</b>.</div>
    </div>`;

  const cats = m.spendingByCategory.slice(0, 8);
  const worst = cats[0]?.amount || 1;
  const hidden = Math.max(0, S.flows.length - 60);

  /* Things that repeat and have not been entered again this month.
     Deliberately NOT added to any total. Salary that has not arrived is not income, and an app
     that quietly counts it would report a surplus he cannot spend. It is a list to confirm —
     one tap each — because the alternative is retyping the same three lines twelve times a year
     and eventually not bothering, and a month missing its salary reads as a month he earned
     nothing. */
  const todo = (S.missing || []).map((r, i) => `
    <div class="todo">
      <span class="dot ${r.dir === 'in' ? 'in' : 'out'}"></span>
      <div class="rmain">
        <div class="rlabel">${esc(r.category || 'uncategorised')}</div>
        <div class="rmeta">${r.dir === 'in' ? '+' : '−'}${esc(Math.round(r.amount).toLocaleString())} ${esc(r.currency)} · usually around the ${r.day}${r.day === 1 ? 'st' : r.day === 2 ? 'nd' : r.day === 3 ? 'rd' : 'th'}</div>
      </div>
      <button class="add" data-repeat="${i}">Yes, add it</button>
    </div>`).join('');

  $('p-month').innerHTML = `
    ${drawMonthStrip()}
    <div class="split">
      <div><h2>In</h2><div class="amt in">${money(m.income)}</div></div>
      <div><h2>Out</h2><div class="amt out">${money(m.spending)}</div></div>
    </div>
    <div class="card">
      <h2>Left over</h2>
      <div class="big ${m.surplus >= 0 ? 'in' : 'out'}">${money(m.surplus)}</div>
      <div class="sub">${m.savingsRatePct != null ? m.savingsRatePct.toFixed(0) + '% of what came in' : ''}${m.passive > 0 ? ' · ' + money(m.passive) + ' passive' : ''}</div>
      ${S.principalRepaid > 0 ? `<div class="note"><b>${money(S.principalRepaid)} of what went out this month bought back your own debt.</b>
        That part is not spending — you are poorer in cash and exactly that much less in debt, so the real
        gap between what you earn and what you consume is ${money(m.surplus + S.principalRepaid)}.</div>` : ''}
    </div>
    ${cats.length ? `<div class="card"><h2>Where it went</h2>${cats.map((c) => `
      <div style="margin-bottom:11px">
        <div style="display:flex;justify-content:space-between;font-size:14px">
          <span>${esc(c.category)}</span><span class="out" style="font-variant-numeric:tabular-nums">${money(c.amount)}</span>
        </div>
        <div class="catbar" style="width:${Math.max(4, (c.amount / worst) * 100)}%"></div>
      </div>`).join('')}</div>` : ''}
    ${m.unconverted.length ? `<div class="warn">No exchange rate for ${esc(m.unconverted.join(', '))} — not counted above.</div>` : ''}
    ${upcoming}
    ${todo ? `<div class="card"><h2>Repeats — not recorded yet</h2>${todo}
      <div class="note">Not counted in anything above. Money that has not arrived is not income.</div></div>` : ''}
    <div class="card"><h2>${esc(showing)}</h2>${rows || '<div class="empty">Nothing recorded in ' + esc(showing) + '.</div>'}
      ${hidden ? `<div class="note">${hidden} more not shown.</div>` : ''}</div>
    <div class="note">Rates ${esc(S.ratesAge)}.</div>`;

  // Land on the month being shown rather than on January. Instant, not smooth: this runs on
  // every redraw, and an animation restarting mid-scroll on each edit is worse than no scroll.
  const strip = $('months');
  const on = strip?.querySelector('.mchip.on');
  if (strip && on) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.clientWidth / 2 + on.offsetWidth / 2);
}

function drawWorth() {
  const w = S.worth;
  const order = { cash: 0, deposit: 1, portfolio: 2, property: 3, card: 4, loan: 5, other: 6 };
  const drawRow = (a) => {
    const t = a.term;
    // How often the money actually MOVES, which is the part he can plan around. A rate is a
    // property of the paper; a payment is a date and an amount.
    const s = t && t.schedule;
    const owes = !!a.liability;
    const pays = owes ? 'You pay' : 'Pays you';
    const sched = !s ? '' : s.payout === 'maturity'
      ? `<div class="rmeta" style="margin-top:4px">All of it at the end — nothing ${owes ? 'is due' : 'lands'} before ${dd(t.end)}.</div>`
      : `<div class="rmeta" style="margin-top:4px">${pays} <b>${Math.round(s.perPayment).toLocaleString()} ${esc(a.currency)}</b>${s.perPaymentInBase != null ? ` (${money(s.perPaymentInBase)})` : ''} ${esc(s.payout)}${s.next ? ` · next ${dd(s.next)}` : ''}${s.total ? ` · ${(owes && a.paymentsMade != null) ? a.paymentsMade : s.made} of ${s.total} so far` : ''}${(owes && a.paymentsLeft != null && a.extraCount > 0) ? ` · ${a.paymentsLeft} left` : ''}
        ${s.estimated ? '<br><span class="out">Estimated — tap ✎ and enter what your statement actually says.</span>' : ''}</div>`;

    /* A LOAN IS NOT A DEPOSIT, and this block used to say it was: "3,191 EUR earned so far", in
       green, on money he was paying out. What a loan does is get repaid, so it gets its own
       wording, its own colour, and its own numbers — what is left to pay, not what is left to
       come. */
    const progress = !(t && t.hasTerm) ? '' : owes ? `
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:5px">
        <span class="out">${money(s && s.paidSoFarInBase != null ? s.paidSoFarInBase : t.earnedInBase)} paid so far</span>
        <span style="color:var(--dim)">${money(s && s.leftToPayInBase != null ? s.leftToPayInBase : t.remainingInBase)} still to pay</span>
      </div>
      <div class="rmeta" style="margin-top:3px">${a.settled ? 'Fully repaid.'
        : `${Math.round(a.owedNow).toLocaleString()} ${esc(a.currency)} still owed of the ${Math.round(a.value).toLocaleString()} borrowed`}</div>` : `
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:5px">
        <span class="in">${money(t.earnedInBase)} earned so far</span>
        <span style="color:var(--dim)">${money(t.remainingInBase)} still to come</span>
      </div>
      ${t.valueAtMaturity != null
        ? `<div class="rmeta" style="margin-top:3px">Pays back ${Math.round(t.valueAtMaturity).toLocaleString()} ${esc(a.currency)} at maturity</div>`
        /* A flat is still his the morning after the tenancy ends. Nobody redeems it, and saying
           "pays back 2,032,000 at maturity" under an apartment is the app describing a
           certificate it thinks he owns. */
        : `<div class="rmeta" style="margin-top:3px">You keep the ${esc(a.kind)} — ${esc(dd(t.end))} is when the ${esc(t.endsWhat)} ends, not the ${esc(a.kind)}.</div>`}`;

    /* EXTRA PAYMENTS, and what they bought.
       A balance derived only from dates says he owes what a borrower who never paid a penny
       extra would owe — and he has. So a loan carries its own history of overpayments, and the
       consequence is spelled out: months off the end and interest never paid, which is the one
       thing no lender ever puts on a statement. */
    const extras = !owes ? '' : `
      <div style="margin-top:6px">
        ${(a.payments || []).map((p) => `<div class="todo" style="padding:7px 0">
          <div class="rmain">
            <div class="rmeta">Extra payment · ${dd(p.at)}${p.note ? ' · ' + esc(p.note) : ''}</div>
          </div>
          <div class="ramt out" style="font-size:13px">−${esc(Math.round(p.amount).toLocaleString())} ${esc(a.currency)}</div>
          <button class="del" data-pay-del="${esc(p.id)}" data-acct="${esc(a.id)}" aria-label="Remove">×</button>
        </div>`).join('')}
        ${a.extraPaid > 0 && a.monthsEarly ? `<div class="rmeta" style="margin-top:4px;color:var(--in)">
          <b>${esc(Math.round(a.extraPaid).toLocaleString())} ${esc(a.currency)} paid on top clears this ${a.monthsEarly} months early${
            a.interestSavedInBase > 0 ? `, saving ${money(a.interestSavedInBase)} of interest` : ''}.</b></div>` : ''}
        <button class="add" data-pay-add="${esc(a.id)}" style="margin-top:6px">+ I paid extra</button>
      </div>`;

    /* What it REALLY costs. A 24% loan whose instalments imply 20.6% is a 20.6% loan, and the
       gap between the paperwork and the payment is only ever visible from the payment. */
    const truth = !(t && t.implied && owes) ? '' : `
      <div class="rmeta" style="margin-top:3px">Over the whole term you repay
        <b>${Math.round(t.implied.totalPaid).toLocaleString()} ${esc(a.currency)}</b> on ${Math.round(a.value).toLocaleString()} borrowed —
        ${Math.round(t.implied.totalInterest).toLocaleString()} of interest, which is
        <b>${t.implied.nominalPct.toFixed(1)}% a year</b>${Math.abs(t.implied.nominalPct - a.ratePct) > 0.6 ? `, not the ${a.ratePct}% on the paperwork` : ''}.</div>`;
    // A dated deposit is the interesting case: how far through, what it has paid so far, and
    // what is still to come. Every figure comes from the server; the page only draws.
    /* An asset that pays an AMOUNT rather than a rate — a flat and its rent. The yield is
       computed and shown, because "12% a year" is the number that says whether the flat is
       working or merely expensive, and it is the same question the app asks of a deposit rate,
       asked of bricks. */
    const yieldLine = t && t.yieldPct != null ? `
      <div class="rmeta" style="margin-top:3px">That is <b>${t.yieldPct.toFixed(1)}% a year</b> on what it is worth${
        t.yieldPct < 4 ? ' — low for something this size. Worth asking what else that money could do.' : ''}</div>` : '';

    const term = t && t.hasTerm ? `
      <div style="margin-top:9px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim)">
          <span>${dd(t.start)} → ${dd(t.end)}</span>
          <span>${t.ended ? (t.redeemable ? 'matured' : esc(t.endsWhat) + ' ended') : Math.round(t.remainingDays) + ' days left'}</span>
        </div>
  
        <div class="bar" style="margin-top:5px"><i style="width:${t.pctThrough}%" ${owes ? 'class="owed"' : ''}></i></div>
        ${progress}
        ${sched}
        ${yieldLine}
        ${truth}
        ${extras}
      </div>` : (t ? `<div class="rmeta" style="margin-top:6px">${money(t.perYearInBase)} a year${t.hasTerm === false && t.start ? ' · running since ' + dd(t.start) : ''}</div>${sched}${yieldLine}${extras}` : '');

    return `
    <div style="padding:11px 0;border-top:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:11px">
        <span class="dot ${a.liability ? 'out' : 'in'}"></span>
        <div class="rmain">
          <div class="rlabel">${esc(a.label || a.kind)}</div>
          <div class="rmeta">${esc(a.kind)}${a.ratePct != null ? ' · ' + a.ratePct + '%' : ''}${a.payout ? ' ' + esc(a.payout) : ''}</div>
        </div>
        <div class="ramt ${a.liability ? 'out' : 'in'}">${a.liability ? '−' : ''}${money(a.inBase)}
          ${a.currency !== S.base ? `<span class="rorig">${esc(Math.round(a.owedNow ?? a.value).toLocaleString())} ${esc(a.currency)}</span>` : ''}
        </div>
        <button class="edit" data-edit="account" data-id="${esc(a.id)}" aria-label="Edit">✎</button>
        <button class="del" data-del="account" data-id="${esc(a.id)}" aria-label="Remove">×</button>
      </div>
      ${term}
    </div>`;
  };

  /* OWNED and OWED, in two lists with their own totals.
     One list ordered by kind meant scrolling past four certificates to reach the loans, and no
     subtotal anywhere — so "how much do I owe" could only be answered by adding the rows up in
     his head. They are different questions and they get different sections. */
  const sorted = (list) => [...list].sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9));
  const owned = sorted(S.accounts.filter((a) => !a.liability));
  const owed = sorted(S.accounts.filter((a) => a.liability));
  const section = (title, list, total, cls) => !list.length ? '' : `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <h2 style="margin-bottom:0">${title}</h2>
        <span class="${cls}" style="font-weight:700;font-variant-numeric:tabular-nums">${cls === 'out' ? '−' : ''}${money(total)}</span>
      </div>
      ${list.map(drawRow).join('')}
    </div>`;

  $('p-worth').innerHTML = `
    <div class="card">
      <h2>Net worth</h2>
      <div class="big ${w.total >= 0 ? '' : 'out'}">${money(w.total)}</div>
      <div class="sub"><span class="in">${money(w.assets)} owned</span>${w.debts > 0 ? ` · <span class="out">${money(w.debts)} owed</span>` : ''}</div>
    </div>
    ${(S.terms?.matured || []).map((t) => `<div class="warn"><b>${esc(t.label)} matured on ${dd(t.at)}.</b>
      ${t.backInBase != null ? money(t.backInBase) + ' came back and is' : 'That money is'} earning nothing until you do something with it.
      Put it somewhere, or change its dates here if it rolled over.</div>`).join('')}
    ${(S.terms?.maturingSoon || []).map((t) => `<div class="warn" style="border-left-color:var(--accent);background:var(--in-bg)">
      <b>${esc(t.label)} matures in ${t.days} days</b>, on ${dd(t.at)}. Worth deciding now where it goes next —
      a certificate that rolls over by default rarely rolls into the best rate available.</div>`).join('')}
    ${(S.terms?.ended || []).map((t) => `<div class="warn" style="border-left-color:var(--src-2);background:rgba(57,135,229,.12)">
      <b>${esc(t.label)}: the ${esc(t.what)} ended on ${dd(t.at)}.</b> You still own it — nothing came back and
      nothing is idle. But it is paying you nothing until it is let again, so it is out of every income figure here.</div>`).join('')}
    ${(S.terms?.endingSoon || []).map((t) => `<div class="warn" style="border-left-color:var(--src-2);background:rgba(57,135,229,.12)">
      <b>${esc(t.label)}: the ${esc(t.what)} ends in ${t.days} days</b>, on ${dd(t.at)}. You keep it either way — but
      the income stops on that date unless it is renewed, and every figure here assumes it does stop.</div>`).join('')}
    ${S.payFirst.map((x) => {
      // The rate that matters is what the payments imply, not what the paperwork says. Quoting
      // 24% at him when his instalments work out at 20.6% is the app being confidently wrong
      // about the one comparison it exists to make.
      const r = (x.impliedPct ?? x.ratePct);
      return `<div class="warn"><b>${esc(x.label)} costs ${r.toFixed(1)}% a year${x.impliedPct != null && Math.abs(x.impliedPct - x.ratePct) > 0.6 ? ` (the paperwork says ${x.ratePct}%)` : ''}.</b>
      Clearing it is a guaranteed ${r.toFixed(1)}% return — better than the ${x.expectedYieldPct}% you'd hope for investing, with no risk. Pay this before buying anything.</div>`;
    }).join('')}
    ${(S.interest.earned > 0 || S.interest.paid > 0) ? `<div class="card"><h2>Interest a year</h2>
      <div style="display:flex;justify-content:space-between"><span class="in">Earning ${money(S.interest.earned)}</span><span class="out">Paying ${money(S.interest.paid)}</span></div>
      <div class="sub">Net ${money(S.interest.net)}${S.interest.shareOfWorth != null ? ` · ${S.interest.shareOfWorth.toFixed(0)}% of everything you own, arriving every year` : ''}</div>
      ${/* The number is nominal, and nearly all of it is earned in a currency he does not spend.
            A 20% rate is not a 20% return to a euro household — high local rates and devaluation
            are not two separate facts, the first is largely compensation for the second. The app
            says this about a single deposit already; printing a confident euro total here without
            it is the same mistake it exists to prevent. No forecast and no rate history needed:
            just the bar the currency has to clear, so he can judge it himself. */ ''}
      ${(S.interest.foreign || []).map((f) => `<div class="note">
        <b>${money(f.annualBase)} of that is earned in ${esc(f.currency)}, at ${f.weightedRatePct.toFixed(1)}% on average — and you spend ${esc(S.base)}.</b>
        If ${esc(f.currency)} loses more than <b>${f.breakEvenFallPct.toFixed(0)}%</b> against ${esc(S.base)} over the next year,
        that interest is a loss in the money that actually buys your groceries. A high local rate is mostly
        payment for that risk, not a free ${f.weightedRatePct.toFixed(0)}%.</div>`).join('')}
      ${(S.interest.ended || []).length ? `<div class="note">Not counted: ${esc(S.interest.ended.join(', '))} — the term has ended, so it is not earning any more.</div>` : ''}
      ${(S.interest.notStarted || []).length ? `<div class="note">Not counted yet: ${esc(S.interest.notStarted.join(', '))} — it has not started.</div>` : ''}
      ${(S.payFirst || []).length ? '<div class="note">What you pay is charged on what you still owe, at the rate your payments actually imply — the same figure as the warning above, not the headline.</div>' : ''}
      </div>` : ''}
    ${section(`What you own · ${owned.length}`, owned, w.assets, 'in')}
    ${section(`What you owe · ${owed.length}`, owed, w.debts, 'out')}
    ${!S.accounts.length ? '<div class="card"><div class="empty">Nothing yet. Tap Add.</div></div>' : ''}
    ${w.exposure.length > 1 ? `<div class="card"><h2>Currency it's in</h2>${w.exposure.map((e) => `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:14px"><span>${esc(e.currency)}</span><span>${e.pct.toFixed(0)}%</span></div>
        <div class="bar"><i style="width:${e.pct}%"></i></div>
      </div>`).join('')}
      ${w.exposure[0] && w.exposure[0].currency !== S.base && w.exposure[0].pct > 50
        ? `<div class="note"><b>${w.exposure[0].pct.toFixed(0)}% of what you own is in ${esc(w.exposure[0].currency)}, which isn't what you spend.</b> If it falls 20%, so does most of your net worth — whatever the assets themselves do.</div>` : ''}
    </div>` : ''}
    ${w.unconverted.length ? `<div class="warn">No exchange rate for ${esc(w.unconverted.join(', '))} — not in the total.</div>` : ''}`;
}

/* Subscriptions.
   The one category of spending nobody decides to make twice: agreed once, then charged for
   ever. So the list is not the point — these two numbers are:

     - EVERYTHING PER YEAR. A yearly bill and a monthly one cannot be compared until both are
       annual. 90 a year is cheaper than 9 a month and does not look it.
     - WHAT IT COSTS IN CAPITAL. A bill that never ends has to be funded by capital that never
       ends, so the same 200 a month that reads as small is 34,000-69,000 he has to build before
       the goal is real. Cancelling one is worth years of contributions, and no expense tracker
       ever says so.

   Nothing here is added to any total elsewhere. A subscription is what he has AGREED to pay;
   the Month tab counts what actually left. Doing both would double-count every charge. */
function drawSubs() {
  const S_ = S.subs || { rows: [] };
  const rows = (S_.rows || []).map((r) => `
    <div class="row" style="${r.ended ? 'opacity:.45' : ''}">
      <span class="dot out"></span>
      <div class="rmain">
        <div class="rlabel">${esc(r.label)}${r.inTrial ? ' <span class="pill out">free trial</span>' : ''}${r.paidThisMonth ? ' <span class="pill">paid</span>' : ''}</div>
        <div class="rmeta">${esc(Math.round(r.amount).toLocaleString())} ${esc(r.currency)} ${esc(r.every)}${
          r.ended ? ' · ended ' + dd(r.endsAt)
          : r.inTrial ? ' · free until ' + dd(r.trialEndsAt)
          : r.next ? ' · next ' + dd(r.next) : ''}</div>
      </div>
      <div class="ramt out">−${money(r.perYearInBase)}<span class="rorig">a year</span></div>
      ${!r.ended && !r.paidThisMonth ? `<button class="edit" data-charge="${esc(r.id)}" title="Record this charge" aria-label="Record this charge">✓</button>` : ''}
      <button class="edit" data-edit="sub" data-id="${esc(r.id)}" aria-label="Edit">✎</button>
      <button class="del" data-del="sub" data-id="${esc(r.id)}" aria-label="Remove">×</button>
    </div>`).join('');

  const cap = S_.capitalNeeded || [];
  const shareOfIncome = S.month && S.month.income > 0 ? (S_.perMonth / S.month.income) * 100 : null;

  $('p-subs').innerHTML = `
    <div class="card">
      <h2>Every subscription, per year</h2>
      <div class="big out">${money(S_.perYear)}</div>
      <div class="sub">${money(S_.perMonth)} a month across ${S_.count} ${S_.count === 1 ? 'subscription' : 'subscriptions'}${
        shareOfIncome != null ? ` · ${shareOfIncome.toFixed(0)}% of what came in this month` : ''}</div>
    </div>
    ${cap.length ? `<div class="card">
      <h2>What that costs in capital</h2>
      <div class="sub" style="font-size:15px;color:var(--ink)">To pay this bill for ever without working, you need
        <b>${money(cap[1].capital)} to ${money(cap[0].capital)}</b> invested behind it.</div>
      <div class="note">At ${cap[1].yieldPct}% and ${cap[0].yieldPct}% a year — the same yields the Goal tab uses.
      That is the real price of a subscription: not the charge, the capital it permanently ties up.
      <b>Cancelling ${money(S_.perMonth / 4)} a month of this is worth about ${money((S_.perYear / 4) / 0.05)} of investing you never have to do.</b></div>
    </div>` : ''}
    ${(S_.trials || []).length ? `<div class="warn"><b>${S_.trials.map((t) => esc(t.label)).join(', ')} ${S_.trials.length === 1 ? 'is' : 'are'} still free.</b>
      ${S_.trials.map((t) => `${esc(t.label)} starts charging ${money(t.perYearInBase / (t.every === 'yearly' ? 1 : t.every === 'quarterly' ? 4 : t.every === 'weekly' ? 52 : 12))} on ${dd(t.trialEndsAt)}`).join('. ')}.
      This is how subscriptions actually cost people money — not by being expensive, by starting.</div>` : ''}
    ${(S_.dueSoon || []).length ? `<div class="card"><h2>Charging in the next two weeks</h2>
      ${S_.dueSoon.map((r) => `<div class="row">
        <div class="rmain"><div class="rlabel">${esc(r.label)}</div><div class="rmeta">${dd(r.next)}</div></div>
        <div class="ramt out">−${money(r.amountInBase)}</div>
      </div>`).join('')}</div>` : ''}
    <div class="card"><h2>What you subscribe to</h2>
      ${rows || `<div class="empty">Nothing yet. Tap Add and type <b>sub 12.99 netflix monthly</b>.</div>`}
      ${rows ? '<div class="note">Every charge lands in the month on the day it bills, the same as a loan instalment or a deposit coupon — one still ahead shows under “still due”. ✓ confirms one early if it has already gone through.</div>' : ''}
    </div>
    ${(S_.unconverted || []).length ? `<div class="warn">No exchange rate for ${esc(S_.unconverted.join(', '))} — not in the totals above.</div>` : ''}`;
}

function drawGoal() {
  if (!S.goal) {
    const c0 = S.contracted;
    $('p-goal').innerHTML = `<div class="card"><h2>Passive income goal</h2>
      <div class="empty">No goal set. Tap Add and type <b>goal 2000</b>.</div></div>
      ${c0 && c0.perMonth > 0 ? `<div class="card"><h2>Already contracted</h2>
        <div class="sub" style="font-size:15px;color:var(--ink)">About ${money(c0.perMonth)} a month is scheduled to arrive from what you already hold.</div>
        <div class="note">Set a goal and this gets a target to sit against.</div></div>` : ''}`;
    return;
  }
  const g = S.goal, p = S.plan, c = S.contracted;
  // Fixed slots, never by rank: rent keeps its colour when a dividend appears beside it, and the
  // "already contracted" list below wears the same colours as the bar above it.
  const SLOT = { rent: 1, interest: 2, dividend: 3 };

  /* Contracted, not counted.
     The big number is what actually LANDED this month, and it has to stay that way: a promise
     is not income, and a goal that counts promises is a goal you can reach without any money
     arriving. But showing 0 beside a certificate that pays 24,750 EGP every quarter reads as an
     app that does not know about the certificate. So it sits below, in its own card, in the
     dim colour, never inside the bar. */
  const contracted = c && (c.streams.length || c.lumps.length) ? `
    <div class="card">
      <h2>Already contracted</h2>
      ${c.perMonth > 0 ? `<div class="sub" style="font-size:15px;color:var(--ink)">About ${money(c.perMonth)} a month is scheduled to arrive from what you already hold.</div>` : ''}
      ${c.streams.map((r) => `<div class="row">
        <span class="swatch" style="background:var(--src-${SLOT[r.category] || 4})"></span>
        <div class="rmain"><div class="rlabel">${esc(r.label)}</div>
          <div class="rmeta">${esc(Math.round(r.perPayment).toLocaleString())} ${esc(r.currency)} ${esc(r.payout)}${r.next ? ' · next ' + dd(r.next) : ''}${r.endsAt ? ' · ends ' + dd(r.endsAt) : ''}</div></div>
        <div class="ramt in">${money((r.inBase || 0) / 12)}<span class="rorig">a month</span></div>
      </div>`).join('')}
      ${c.lumps.map((r) => `<div class="row">
        <div class="rmain"><div class="rlabel">${esc(r.label)}</div>
          <div class="rmeta">all at once on ${dd(r.at)} — nothing monthly until then</div></div>
        <div class="ramt">${money(r.inBase)}</div>
      </div>`).join('')}
      ${c.owedPerMonth > 0 ? `<div class="note out">And about ${money(c.owedPerMonth)} a month goes back out on what you owe.</div>` : ''}
      <div class="note">This is the yearly <i>rate</i> behind those holdings. The figure above counts
      only what has actually landed and been dated into a month — each coupon joins it on the day it
      pays, not before. A promise is not income until it arrives.</div>
    </div>` : '';

  /* The bar, split by where the money comes from.
     Fixed slots, never by rank: rent keeps its colour when a dividend appears beside it. And
     every segment is named with its amount underneath, because two of these steps sit under 3:1
     on a light background — and because colour never carries meaning alone anywhere in this app. */
  const slotOf = (c) => SLOT[c] || 4;
  const sources = g.sources || [];
  const coming = sources.reduce((t, x) => t + x.coming, 0);
  const meter = !sources.length
    ? `<div class="bar"><i style="width:${Math.min(100, g.pct)}%"></i></div>`
    : `<div class="meter">
        ${sources.map((x) => x.amount > 0
          ? `<i style="width:${Math.min(100, x.pctOfTarget)}%;background:var(--src-${slotOf(x.category)})"></i>` : '').join('')}
        ${sources.map((x) => x.coming > 0
          ? `<i class="coming" style="width:${Math.min(100, x.pctComing)}%;background-color:var(--src-${slotOf(x.category)})"></i>` : '').join('')}
       </div>
       <div class="legend">${sources.map((x) => `<div>
         <span class="swatch ${x.amount > 0 ? '' : 'coming'}" style="background-color:var(--src-${slotOf(x.category)})"></span>
         <span class="lname">${esc(x.category)}</span>
         <span class="lamt">${x.amount > 0 ? money(x.amount, g.currency) : ''}${
           x.coming > 0 ? `<span style="color:var(--dim);font-weight:400">${x.amount > 0 ? ' + ' : ''}${money(x.coming, g.currency)} to come</span>` : ''}</span>
       </div>`).join('')}</div>
       ${coming > 0 ? `<div class="note">The hatched part is contracted and has not arrived yet this month —
       ${money(coming, g.currency)} of it. It is not in the ${money(g.now, g.currency)} above, which counts only
       what has actually landed.</div>` : ''}`;

  /* AND THE HONEST PART. A certificate that matures in 2027 is not the same income as a flat he
     owns. A progress bar that treats them alike tells him he is closer than he is. */
  const ends = S.passiveEnds || { rows: [] };
  const ending = !ends.rows.length ? '' : `
    <div class="warn" style="border-left-color:var(--src-2);background:rgba(57,135,229,.12)">
      <b>${money(ends.perMonth)} a month of this comes from holdings that end.</b>
      ${ends.rows.map((r) => `${esc(r.label)} — ${esc(r.what)} ends ${dd(r.endsAt)}`).join(', ')}.
      A certificate hands the money back and stops; a tenancy just stops, and the flat is still yours
      to let again. Either way, reaching ${money(g.target, g.currency)} on arrangements that expire is
      reaching it until they do.
    </div>`;

  $('p-goal').innerHTML = `
    <div class="card">
      <h2>Passive income</h2>
      <div class="big in">${money(g.now, g.currency)}</div>
      <div class="sub">of ${money(g.target, g.currency)} a month · ${g.pct.toFixed(1)}%</div>
      ${meter}
      <div class="sub" style="margin-top:10px">${money(g.gap, g.currency)} a month still to go</div>
    </div>
    ${ending}
    ${contracted}
    ${p && p.fastest != null ? `<div class="card">
      <h2>What it would take</h2>
      ${p.scenarios.map((s) => `<div class="row">
        <div class="rmain"><div class="rlabel">${s.yieldPct.toFixed(1)}% yield</div>
          <div class="rmeta">needs ${money(s.capitalNeeded)} invested</div></div>
        <div class="ramt">${s.years == null ? '—' : s.years + ' yrs'}</div>
      </div>`).join('')}
      <div class="note">Roughly <b>${p.fastest}–${p.slowest} years</b> at what you saved this month. Assumes ${esc(p.assumes)}.
      Saving more moves this far faster than picking better investments does.</div>
    </div>` : p ? `<div class="card"><div class="note">Nothing was saved this month, so on these numbers the goal isn't reachable. The savings rate is the lever, not the returns.</div></div>` : ''}`;
}


/* The years ahead.
   ONE hue, not three. The low/mid/high yields are a RANGE, not three identities — painting
   them as separate colours would say "these are three plans" when the truth is "this is one
   plan and we do not know which line it lands on". So the bar is the middle case in the
   page's single accent, and the spread is printed as text beside it, where it cannot be
   mistaken for precision. Every year is directly labelled, so nothing needs a hover. */
function drawPlan() {
  const f = S.forecast;
  if (!f) { $('p-plan').innerHTML = '<div class="card"><div class="empty">Nothing to project yet.</div></div>'; return; }
  const mid = f.mid, low = f.low, high = f.high;
  const peak = high.rows[high.rows.length - 1].capital || 1;
  const goal = S.goal?.target || 0;
  const yrs = mid.rows.length;

  /* WHERE THE MONEY COMES FROM, listed before what it becomes.
     The old tab handed him a number built from things he could not see: this month's measured
     surplus, silently, plus four prompt() boxes. He said it was not clear, and he was right —
     a projection you cannot take apart is not a plan, it is a claim. So the pieces come first,
     each in his own words, each editable, and the total is visibly their sum. */
  const money0 = (n) => money(n).replace(/\s*EUR$/, '');
  const per = (e) => e.kind === 'lump'
    ? `${money(e.amount)} once in year ${e.atYear}`
    : `${money(e.amount)} a month from year ${e.atYear}${e.untilYear ? ` to ${e.untilYear}` : ''}`;
  const what = { contribution: 'you put in', income: 'arrives', spending: 'goes out', lump: 'one-off' };

  const pieces = (S.events || []).map((e) => `
    <div class="row">
      <span class="dot ${e.kind === 'spending' ? 'out' : 'in'}"></span>
      <div class="rmain">
        <div class="rlabel">${esc(e.label || e.kind)}</div>
        <div class="rmeta">${esc(what[e.kind] || e.kind)} · ${per(e)}${e.ratePct != null ? ` · grows at ${e.ratePct}%` : ''}</div>
      </div>
      <button class="edit" data-plan-edit="${esc(e.id)}" aria-label="Edit">✎</button>
      <button class="del" data-plan-del="${esc(e.id)}" aria-label="Remove">×</button>
    </div>`).join('');

  const base = S.planBase || 0;
  const listedMonthly = (S.events || [])
    .filter((e) => e.kind !== 'lump')
    .reduce((n, e) => n + (e.kind === 'spending' ? -e.amount : e.amount), 0);

  $('p-plan').innerHTML = `
    <div class="card">
      <h2>What goes in</h2>
      <div class="big ${base + listedMonthly >= 0 ? 'in' : 'out'}">${money(base + listedMonthly)}<span style="font-size:15px;color:var(--dim);font-weight:400"> a month</span></div>
      <div class="sub">${base > 0 ? `${money(base)} measured + ` : ''}${money(listedMonthly)} from what you listed below</div>
    </div>

    <div class="card">
      <h2>Where it comes from</h2>
      <div class="row">
        <span class="dot ${S.planUseMeasured ? 'in' : 'out'}"></span>
        <div class="rmain">
          <div class="rlabel">What you actually saved this month</div>
          <div class="rmeta">${S.planUseMeasured ? `${money(base)} a month, measured — not a guess` : 'switched off — only what you list below counts'}</div>
        </div>
        <button class="add" data-plan-base="${S.planUseMeasured ? 'off' : 'on'}">${S.planUseMeasured ? 'Ignore it' : 'Use it'}</button>
      </div>
      ${pieces}
      <button class="btn ghost" id="addevent" style="margin-top:12px">+ Add money, income, or a cost</button>
      <div class="note">Everything here is yours to set. Anything with its own rate — a deposit at
      2%, a bond — grows at that rate; everything else grows at the market range below, because
      those are not the same money.</div>
    </div>

    <div class="card">
      <h2>What it becomes in ${yrs} years</h2>
      <div class="big in">${money(mid.endPassive)}<span style="font-size:15px;color:var(--dim);font-weight:400">/mo without working</span></div>
      <div class="sub">${money(mid.endCapital)} invested · could be ${money(low.endCapital)} or ${money(high.endCapital)}</div>
      ${mid.ownRate.length ? `<div class="note">${mid.ownRate.map((b) => `${money(b.capital)} of that is at your own ${b.ratePct}%, not the market's`).join('. ')}.</div>` : ''}
      ${mid.goalReachedInYear ? `<div class="sub in" style="margin-top:6px">You reach ${money(goal)} a month in year ${mid.goalReachedInYear}.</div>`
        : (goal > 0 ? `<div class="sub" style="margin-top:6px">Not enough to reach ${money(goal)} a month inside ${yrs} years. Adding to what goes in moves this far more than a better yield does.</div>` : '')}
    </div>

    <div class="card">
      <h2>Year by year</h2>
      ${mid.rows.map((r, i) => {
        const lo = low.rows[i].capital, hi = high.rows[i].capital;
        const met = goal > 0 && r.passiveMonthly >= goal;
        return `
        <div style="margin-bottom:13px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px">
            <span style="color:var(--dim)">Year ${r.year}${r.events.length ? ' · ' + esc(r.events.join(', ')) : ''}${r.ends.length ? ' · ' + esc(r.ends.join(', ')) + ' ends' : ''}</span>
            <span style="font-variant-numeric:tabular-nums;font-weight:600">${money(r.capital)}${met ? ' <span class="pill">goal</span>' : ''}</span>
          </div>
          <div class="bar" style="margin-top:5px"><i style="width:${Math.max(2, (r.capital / peak) * 100)}%"></i></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:4px">
            <span>${money(lo)} – ${money(hi)} depending on yield</span>
            <span>${money(r.passiveMonthly)}/mo</span>
          </div>
        </div>`;
      }).join('')}
      <div class="note">The bar is the middle case, 5% a year. The range beside it is 3.5% to 7% —
      over a decade that assumption is most of the answer, which is why it is a spread and not a
      number. Assumes ${esc(f.assumes)}.</div>
    </div>`;

  $('addevent').onclick = () => openPlanEvent();
}

/* WHAT THE CURRENCY IS DOING TO HIM.
   Nine tenths of what he owns is in Egyptian pounds and every bill he pays is in euro. That is
   the largest single fact about this household — larger than which deposit pays what — and the
   app could convert his money for months without ever saying what the currency itself had cost
   him. The arithmetic for it (realReturn) has been in fx.js since the first week and had never
   once run, because nothing ever passed it a rate from the past.

   Nothing here is invented. Where he has not said what he paid for the money, it asks instead of
   guessing; where there is no recorded history, it says the record starts today rather than
   drawing a line through one point. */
function drawFx() {
  const list = S.currencies || [];
  if (!list.length) {
    $('p-fx').innerHTML = `<div class="card"><h2>Currencies</h2>
      <div class="empty">Everything you hold is already in ${esc(S.base)}, so there is nothing here
      to move against you.</div></div>`;
    return;
  }

  const pctFmt = (v) => (v > 0 ? '+' : '') + v.toFixed(1) + '%';

  $('p-fx').innerHTML = list.map((c) => {
    if (c.unconverted) {
      return `<div class="card"><h2>${esc(c.currency)}</h2>
        <div class="warn">No rate for ${esc(c.currency)} today, so nothing it holds is in any total.</div></div>`;
    }
    const untold = c.holdings.filter((h) => h.rateThen == null);
    return `
    <div class="card">
      <h2>${esc(c.currency)}</h2>
      <div class="big">${c.rateNow.toLocaleString(undefined, { maximumFractionDigits: 2 })}<span style="font-size:15px;color:var(--dim);font-weight:400"> ${esc(c.currency)} to 1 ${esc(S.base)}</span></div>
      <div class="sub">${esc(S.ratesAge || '')}${c.changePct != null
        ? ` · ${pctFmt(c.changePct)} since ${dd(c.since)}${c.sinceIsBasis ? '' : ' — when this app started keeping a record'}`
        : ''}</div>
      ${!c.sinceIsBasis && c.series.length < 2 ? `<div class="note">Nothing to compare today against
        yet. Rather than wait for a diary to fill up, tell it what you exchanged at — you bought
        these ${esc(c.currency)} with ${esc(S.base)}, so you already know.</div>` : ''}

      ${/* WHAT HE PUT IN, AGAINST WHAT IT IS WORTH. Every pound came from euro, so this is not an
            estimate of anything: it is the price he paid beside the price today, and it is the
            question the whole tab exists for. */ ''}
      ${c.investedInBase != null ? `
      <div class="row" style="margin-top:12px">
        <div class="rmain"><div class="rlabel">You put in</div>
          <div class="rmeta">at ${c.basisRate ? c.basisRate.toLocaleString(undefined, { maximumFractionDigits: 2 }) : '—'} ${esc(c.currency)} to the ${esc(S.base)}, from ${dd(c.since)}</div></div>
        <div class="ramt">${money(c.investedInBase)}</div>
      </div>
      <div class="row">
        <div class="rmain"><div class="rlabel">It is worth</div>
          <div class="rmeta">today, at ${c.rateNow.toLocaleString(undefined, { maximumFractionDigits: 2 })}</div></div>
        <div class="ramt ${c.exposureInBase >= 0 ? 'in' : 'out'}">${money(c.exposureInBase)}</div>
      </div>
      <div class="row">
        <div class="rmain"><div class="rlabel">The rate has ${c.movedInBase >= 0 ? 'given you' : 'taken'}</div>
          <div class="rmeta">${pctFmt(c.changePct)} on the ${esc(c.currency)}${c.untold ? ` · ${c.untold} holding${c.untold === 1 ? '' : 's'} not counted` : ''}</div></div>
        <div class="ramt ${c.movedInBase >= 0 ? 'in' : 'out'}">${money(c.movedInBase)}</div>
      </div>` : `
      <div class="row" style="margin-top:12px">
        <div class="rmain"><div class="rlabel">What you hold in ${esc(c.currency)}</div>
          <div class="rmeta">assets minus what you owe in it</div></div>
        <div class="ramt ${c.exposureInBase >= 0 ? 'in' : 'out'}">${money(c.exposureInBase)}</div>
      </div>`}
      <button class="add" data-fx="${esc(c.currency)}" style="margin-top:10px">
        ${c.basisRate ? `Change what you exchanged at (${c.basisRate.toLocaleString(undefined, { maximumFractionDigits: 2 })})` : `What did you exchange at?`}
      </button>

      <div class="note" style="margin-top:12px"><b>If ${esc(c.currency)} weakens ${c.sensitivity[0].weakensPct}% against ${esc(S.base)},
      you are ${money(Math.abs(c.sensitivity[0].deltaInBase))} ${c.sensitivity[0].deltaInBase < 0 ? 'poorer' : 'richer'};
      at ${c.sensitivity[1].weakensPct}%, ${money(Math.abs(c.sensitivity[1].deltaInBase))}.</b>
      No forecast in that — it is the size of the bet you are already holding, which is what decides
      whether it is one you want.</div>
    </div>

    <div class="card">
      <h2>Holding by holding</h2>
      ${c.holdings.map((h) => `
        <div class="row">
          <span class="dot ${h.owed ? 'out' : 'in'}"></span>
          <div class="rmain">
            <div class="rlabel">${esc(h.label)}</div>
            <div class="rmeta">${h.rateThen
              ? `at ${h.rateThen.toLocaleString(undefined, { maximumFractionDigits: 2 })}${h.rateSource === 'basis' ? ' (what you exchanged at)' : ' (its own rate)'} · worth ${money(h.thenInBase)} then`
              : 'no starting rate — say what you exchanged at above, or tap ✎ on it in Worth for its own'}</div>
            ${h.real ? `<div class="rmeta ${h.real.realPct >= 0 ? 'in' : 'out'}">Its ${h.kind === 'loan' || h.kind === 'card' ? 'cost' : 'return'} is
              <b>${h.real.realPct.toFixed(1)}% a year in ${esc(S.base)}</b>, not the headline —
              the rate moved ${h.real.currencyMovePct.toFixed(1)}% under it.</div>` : ''}
          </div>
          <div class="ramt ${h.moveInBase == null ? '' : h.moveInBase >= 0 ? 'in' : 'out'}">
            ${h.moveInBase == null ? money(h.nowInBase) : `${h.moveInBase >= 0 ? '+' : ''}${money(h.moveInBase)}`}
            <span class="rorig">${h.moveInBase == null ? 'today' : 'from the rate'}</span>
          </div>
        </div>`).join('')}
      ${untold.length ? `<div class="note">A holding with no starting rate is shown at what it is
      worth today. The app will not invent a rate you did not pay — a made-up starting point makes
      a made-up gain, which is worse than no answer. One that bought in at a different time can
      have its own: tap ✎ on it in Worth.</div>` : ''}
    </div>`;
  }).join('') + `
    <div class="note">A high local rate and a falling currency are not two separate facts: the
    first is largely payment for the second. That is the same question this app asks of a 20%
    deposit and of a 24% loan, asked of the money itself.</div>`;
}

// ---- Tabs ----
const TABS = ['month', 'worth', 'subs', 'goal', 'plan', 'fx'];
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
  for (const name of TABS) $('p-' + name).hidden = (name !== t.dataset.tab);
  tg?.HapticFeedback?.selectionChanged?.();
});

// ---- Add ----
const CHIPS = ['out 40 food', 'in 3200 salary', 'in 27000 EGP rent', 'add property 2700000 EGP apartment pays 27000 monthly', 'sub 12.99 netflix monthly', 'sub 90 icloud yearly', 'add card 1200 EUR 19% visa', 'add loan 445000 EGP 24% quarterly pays 58063.45 start 28.11.2024 end 28.05.2027', 'add deposit 495000 EGP 20% quarterly start 28.05.2024 end 28.05.2027', 'goal 2000'];
$('chips').innerHTML = CHIPS.map((c) => `<button class="chip">${esc(c)}</button>`).join('');
$('chips').onclick = (e) => { if (e.target.classList.contains('chip')) { $('entry').value = e.target.textContent; $('entry').focus(); } };

const openSheet = () => { $('sheet').hidden = false; $('err').hidden = true; $('entry').value = ''; $('entry').focus(); };
const closeSheet = () => { $('sheet').hidden = true; };
$('fab').onclick = openSheet;
$('cancel').onclick = closeSheet;
$('sheet').onclick = (e) => { if (e.target === $('sheet')) closeSheet(); };
$('entry').onkeydown = (e) => { if (e.key === 'Enter') $('save').click(); };

$('save').onclick = async () => {
  const text = $('entry').value.trim();
  if (!text) return;
  // A new entry is stamped with today, so record it into today's month. Adding while reading
  // last March and seeing nothing appear is the same as the app losing it.
  viewMonth = null;
  $('save').disabled = true;
  try {
    // "goal 2000" is the one line that isn't an entry, so it is routed here rather than being
    // taught to the shared parser, which must keep meaning exactly what the bot means.
    const g = text.match(/^goal\s+(\d+(?:[.,]\d+)?)$/i);
    S = g ? await api('/api/goal', { monthly: Number(g[1].replace(',', '.')) })
          : await api('/api/entry', { text });
    draw(); closeSheet();
    tg?.HapticFeedback?.notificationOccurred?.('success');
  } catch (err) {
    $('err').textContent = err.message; $('err').hidden = false;
  } finally { $('save').disabled = false; }
};

// ---- Editing something already recorded ----
//
// Real fields, not the one-line grammar. Retyping "out 40 food" to fix a mistyped amount adds a
// SECOND entry, and a month that double-counts is worse than one that was wrong once.
//
// The currency is a LIST, never a text box: "EGY" typed into a free field would sanitise to
// nothing, fall back to the base, and quietly move an Egyptian holding into euro.
let editing = null;

const isoOf = (ms) => (ms ? new Date(ms).toISOString().slice(0, 10) : '');
const field = (label, inner) => `<div class="field"><label>${esc(label)}</label>${inner}</div>`;
const input = (k, value, extra = '') => `<input data-k="${k}" value="${esc(value ?? '')}" ${extra}>`;
const select = (k, options, current) =>
  `<select data-k="${k}">${options.map((o) => {
    const v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
    return `<option value="${esc(v)}" ${v === (current ?? '') ? 'selected' : ''}>${esc(t)}</option>`;
  }).join('')}</select>`;
const seg = (name, options, current, type = '') =>
  `<div class="seg" data-seg="${name}" data-type="${type}">${options.map((o) =>
    `<button type="button" data-val="${esc(o.v)}" class="${o.v === current ? 'on' : ''}">${esc(o.t)}</button>`).join('')}</div>`;

/** His currencies first, then the rest. A 46-item alphabetical list buries EGP under Argentina. */
function currencyOptions(current) {
  const used = [...new Set([...(S.accounts || []).map((a) => a.currency), ...(S.flows || []).map((f) => f.currency), S.base, current].filter(Boolean))];
  const rest = (S.currencies || []).filter((c) => !used.includes(c)).sort();
  return [...used, ...rest];
}

function flowFields(f) {
  return `
    ${field('Money', seg('dir', [{ v: 'in', t: '+ In' }, { v: 'out', t: '− Out' }], f.dir))}
    ${field('Name', input('category', f.category))}
    <div class="two">
      ${field('Amount', input('amount', f.amount, 'inputmode="decimal"'))}
      ${field('Currency', select('currency', currencyOptions(f.currency), f.currency))}
    </div>
    ${field('Date', input('date', isoOf(f.ts), 'type="date"'))}
    ${field('Counts towards the passive goal', seg('passive', [{ v: 'yes', t: 'Yes' }, { v: 'no', t: 'No' }], f.passive ? 'yes' : 'no', 'bool'))}
    ${field('Repeats every month', seg('recurring', [{ v: 'yes', t: 'Yes' }, { v: 'no', t: 'No' }], f.recurring ? 'yes' : 'no', 'bool'))}`;
}

function accountFields(a) {
  const payouts = [{ v: '', t: 'not said' }, ...(S.payoutKinds || []).map((p) => ({ v: p, t: p }))];
  return `
    ${field('Name', input('label', a.label))}
    <div class="two">
      ${field('Amount', input('value', a.value, 'inputmode="decimal"'))}
      ${field('Currency', select('currency', currencyOptions(a.currency), a.currency))}
    </div>
    ${field('What it is', select('kind', S.kinds || [], a.kind))}
    <div class="two">
      ${field('Rate % a year', input('ratePct', a.ratePct ?? '', 'inputmode="decimal" placeholder="only if it has one"'))}
      ${field(a.liability ? 'Paid back' : 'Paid out', select('payout', payouts, a.payout || ''))}
    </div>
    ${field(a.liability ? 'What you actually pay each time'
      : a.kind === 'property' ? 'Rent it pays you each time'
      : 'What it actually pays each time',
      input('payment', a.payment ?? '', 'inputmode="decimal" placeholder="' + (a.kind === 'property' ? '27000' : 'leave empty to work it out') + '"'))}
    <div class="two">
      ${field('Starts', input('startsAt', isoOf(a.startsAt), 'type="date"'))}
      ${field('Ends', input('endsAt', isoOf(a.endsAt), 'type="date"'))}
    </div>
    ${a.currency !== S.base ? field(`Rate when you got it — ${esc(a.currency)} to 1 ${esc(S.base)}`,
      input('rateThen', a.rateThen ?? '', 'inputmode="decimal" placeholder="e.g. 54"')) : ''}
    <div class="note" style="margin-top:0">Dates and how often it pays are what turn a rate into money
    on a date — leave them empty if you don't know them. The payment beats every calculation here:
    a loan repays principal as well as interest, and only your statement knows the exact figure.
    <br><br><b>A flat does not need a rate.</b> Put the rent in the payment box and set how often it
    arrives, and the app works the yield out for you — and drops the rent into each month as passive
    income towards your goal.
    <br><br>The <b>rate when you got it</b> is what unlocks the Rates tab for this holding: what
    the currency has done to it since, and what its return really is in ${esc(S.base)}.</div>`;
}

function subFields(r) {
  return `
    ${field('Name', input('label', r.label))}
    <div class="two">
      ${field('Amount', input('amount', r.amount, 'inputmode="decimal"'))}
      ${field('Currency', select('currency', currencyOptions(r.currency), r.currency))}
    </div>
    <div class="two">
      ${field('Billed', select('every', S.billingPeriods || ['monthly'], r.every))}
      ${field('Category', input('category', r.category))}
    </div>
    ${field('Started', input('startsAt', isoOf(r.startsAt), 'type="date"'))}
    <div class="two">
      ${field('Free until', input('trialEndsAt', isoOf(r.trialEndsAt), 'type="date"'))}
      ${field('Cancelled from', input('endsAt', isoOf(r.endsAt), 'type="date"'))}
    </div>
    <div class="note" style="margin-top:0">Set <b>Cancelled from</b> the day you cancel rather than
    deleting it — a subscription that still bills until March is money you owe, and the row is the
    only record that you stopped it.</div>`;
}

/** "I paid extra." Date, amount, and a word about what it was — because in six months
 *  "1,000 on 2 July" means nothing and "1,000, bonus" means everything. */
function openExtraPayment(accountId) {
  const a = S.accounts.find((x) => x.id === accountId);
  if (!a) return;
  editing = { kind: 'extraPayment', id: accountId };
  $('etitle').textContent = `Extra payment on ${a.label || a.kind}`;
  $('eerr').hidden = true;
  $('efields').innerHTML = `
    <div class="two">
      ${field(`Amount in ${esc(a.currency)}`, input('amount', '', 'inputmode="decimal" placeholder="500"'))}
      ${field('When', input('at', isoOf(Date.now()), 'type="date"'))}
    </div>
    ${field('What was it', input('note', '', 'placeholder="bonus"'))}
    <div class="note" style="margin-top:0">Anything you paid beyond the instalment: an
    overpayment, a lump off the principal, or an instalment from before the start date this loan
    is set to. It comes straight off what you owe, and the app will tell you how many months
    earlier this clears because of it.</div>`;
  $('esheet').hidden = false;
}

/** "I exchanged at 48, from May 2024." One fact for the whole position, because that is how the
 *  money got there — he took euro and converted them, and asking for a starting rate inside five
 *  separate holdings was asking five times for the same thing.
 *
 *  The date defaults to the day he first held that currency, so the only thing to type is a rate. */
function openFxBasis(currency) {
  const c = (S.currencies || []).find((x) => x.currency === currency);
  if (!c) return;
  editing = { kind: 'fxBasis', id: currency };
  $('etitle').textContent = `What did you exchange ${currency} at?`;
  $('eerr').hidden = true;
  $('efields').innerHTML = `
    <div class="two">
      ${field(`${esc(currency)} to 1 ${esc(S.base)}`, input('rateThen', c.basisRate ?? '', 'inputmode="decimal" placeholder="e.g. 48"'))}
      ${field('From', input('at', isoOf(c.basisAt || c.firstHeld), 'type="date"'))}
    </div>
    <div class="note" style="margin-top:0">Today it is
    <b>${c.rateNow.toLocaleString(undefined, { maximumFractionDigits: 2 })}</b>. The date is filled in with
    the day you first held ${esc(currency)} — change it if you moved the money over at a different time.
    <br><br>This stands in for every ${esc(currency)} holding that has no rate of its own; one you bought
    in at a different rate can still have its own, on its ✎ in Worth. Leave the rate empty to clear it.</div>`;
  $('esheet').hidden = false;
}

function openEdit(kind, id) {
  const it = kind === 'flow' ? S.flows.find((f) => f.id === id)
    : kind === 'sub' ? (S.subs?.rows || []).find((r) => r.id === id)
    : S.accounts.find((a) => a.id === id);
  if (!it) return;
  editing = { kind, id };
  $('etitle').textContent = kind === 'flow' ? 'Edit this entry'
    : kind === 'sub' ? 'Edit this subscription' : 'Edit what you hold';
  $('eerr').hidden = true;
  $('efields').innerHTML = kind === 'flow' ? flowFields(it)
    : kind === 'sub' ? subFields(it) : accountFields(it);
  $('esheet').hidden = false;
}
const closeEdit = () => { $('esheet').hidden = true; editing = null; };
$('ecancel').onclick = closeEdit;
$('esheet').onclick = (e) => { if (e.target === $('esheet')) closeEdit(); };
$('efields').onclick = (e) => {
  const b = e.target.closest('.seg button');
  if (!b) return;
  b.parentElement.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
};

$('esave').onclick = async () => {
  if (!editing) return;
  if (editing.kind === 'fxBasis') {
    const v = {};
    $('efields').querySelectorAll('[data-k]').forEach((el) => { v[el.dataset.k] = el.value.trim(); });
    $('esave').disabled = true;
    try {
      S = await api('/api/fxbasis', { currency: editing.id, rateThen: v.rateThen === '' ? 0 : Number(v.rateThen), at: v.at });
      draw(); closeEdit();
      tg?.HapticFeedback?.notificationOccurred?.('success');
    } catch (err) { $('eerr').textContent = err.message; $('eerr').hidden = false; }
    finally { $('esave').disabled = false; }
    return;
  }

  if (editing.kind === 'extraPayment') {
    const v = {};
    $('efields').querySelectorAll('[data-k]').forEach((el) => { v[el.dataset.k] = el.value.trim(); });
    if (!Number(v.amount)) { $('eerr').textContent = 'How much did you pay?'; $('eerr').hidden = false; return; }
    $('esave').disabled = true;
    try {
      S = await api('/api/payment', { id: editing.id, amount: Number(v.amount), at: v.at, note: v.note });
      draw(); closeEdit();
      tg?.HapticFeedback?.notificationOccurred?.('success');
    } catch (err) { $('eerr').textContent = err.message; $('eerr').hidden = false; }
    finally { $('esave').disabled = false; }
    return;
  }

  if (editing.kind === 'planEvent') {
    const v = {};
    $('efields').querySelectorAll('[data-k]').forEach((el) => { v[el.dataset.k] = el.value.trim(); });
    if (!v.label || !Number(v.amount) || !Number(v.atYear)) {
      $('eerr').textContent = 'It needs a name, an amount and a year.'; $('eerr').hidden = false; return;
    }
    const piece = {
      label: v.label, kind: v.kind,
      amount: Number(v.amount), atYear: Number(v.atYear),
      // Empty means "whatever the market does" and "forever" — both are real answers, so both
      // are stored as null rather than as a zero that would quietly mean something else.
      ratePct: v.ratePct === '' ? null : Number(v.ratePct),
      untilYear: v.untilYear === '' ? null : Number(v.untilYear),
    };
    $('esave').disabled = true;
    try {
      S = await api('/api/plan', editing.id ? { edit: editing.id, patch: piece } : piece);
      draw(); closeEdit();
    } catch (err) { $('eerr').textContent = err.message; $('eerr').hidden = false; }
    finally { $('esave').disabled = false; }
    return;
  }
  const patch = {};
  $('efields').querySelectorAll('[data-k]').forEach((el) => { patch[el.dataset.k] = el.value; });
  $('efields').querySelectorAll('[data-seg]').forEach((g) => {
    const on = g.querySelector('button.on');
    if (!on) return;
    // A yes/no group must arrive as a real boolean: the STRING "no" is truthy, and a passive
    // flag set from it would count a salary towards the passive-income goal.
    patch[g.dataset.seg] = g.dataset.type === 'bool' ? on.dataset.val === 'yes' : on.dataset.val;
  });
  $('esave').disabled = true;
  try {
    S = await api('/api/edit', { kind: editing.kind, id: editing.id, patch });
    draw(); closeEdit();
    tg?.HapticFeedback?.notificationOccurred?.('success');
  } catch (err) {
    $('eerr').textContent = err.message; $('eerr').hidden = false;
  } finally { $('esave').disabled = false; }
};

/** A piece of the plan, in his words: "500 from salary", "rent from apartment 1",
 *  "deposit 10000 under 2%", "in year 3 another apartment".
 *
 *  One form for adding and for editing, and the same sheet as everything else, so there is one
 *  way to fill in a form in this app rather than two. */
function openPlanEvent(existing) {
  const e = existing || { kind: 'contribution', atYear: 1, amount: '', label: '', ratePct: '', untilYear: '' };
  editing = { kind: 'planEvent', id: existing?.id };
  $('etitle').textContent = existing ? 'Edit this piece' : 'Add to the plan';
  $('eerr').hidden = true;
  $('efields').innerHTML = `
    ${field('What is it', input('label', e.label, 'placeholder="rent from apartment 1"'))}
    ${field('What does it do', select('kind', [
      { v: 'contribution', t: 'I put this in every month' },
      { v: 'income', t: 'this money arrives every month' },
      { v: 'lump', t: 'I add this once' },
      { v: 'spending', t: 'this costs me every month' },
    ], e.kind))}
    <div class="two">
      ${field('Amount', input('amount', e.amount, 'inputmode="decimal" placeholder="500"'))}
      ${field('Its own rate %', input('ratePct', e.ratePct ?? '', 'inputmode="decimal" placeholder="market"'))}
    </div>
    <div class="two">
      ${field('From year', input('atYear', e.atYear, 'inputmode="numeric"'))}
      ${field('Until year', input('untilYear', e.untilYear ?? '', 'inputmode="numeric" placeholder="forever"'))}
    </div>
    <div class="note" style="margin-top:0">Year 1 is the next twelve months, so <b>from year 1</b>
    means starting now. Leave the rate empty and it grows with the market range; put <b>2</b> there
    for a deposit paying 2% and it grows at 2% instead. Everything is in ${esc(S.base)}.
    <br><br><b>“I put this in”</b> is money you move from your pocket into the pot.
    <b>“This money arrives”</b> is rent or a dividend — it goes into the pot too, and it counts
    towards your ${money(S.goal?.target || 2000)} a month goal, which is the only difference.</div>`;
  $('esheet').hidden = false;
}

document.body.addEventListener('click', async (e) => {
  // Which month is being read. The whole state comes back for it, so every tab stays in step.
  const mo = e.target.closest('[data-month]');
  if (mo) {
    if (mo.dataset.month === S.monthKey) return;
    viewMonth = mo.dataset.month;
    if (await work(() => api('/api/state'))) tg?.HapticFeedback?.selectionChanged?.();
    return;
  }
  const ed = e.target.closest('[data-edit]');
  if (ed) { openEdit(ed.dataset.edit, ed.dataset.id); return; }

  // "Yes, it arrived again." Records a real flow — nothing is ever added on its own.
  const rep = e.target.closest('[data-repeat]');
  if (rep) {
    const r = (S.missing || [])[Number(rep.dataset.repeat)];
    if (!r) return;
    if (await work(() => api('/api/repeat', r))) tg?.HapticFeedback?.notificationOccurred?.('success');
    return;
  }

  // A subscription charged. It becomes a real spend in the month, tagged with the subscription
  // it came from — never on a schedule, because a charge can fail, be refunded, or be cancelled
  // the week before, and the app must not invent spending that did not happen.
  // "It went through." Turns a projection into a real, editable flow — replacing it, never
  // adding to it, because the projection was already counted.
  const cfm = e.target.closest('[data-confirm]');
  if (cfm) {
    if (await work(() => api('/api/confirm', { schedId: cfm.dataset.confirm }))) {
      tg?.HapticFeedback?.notificationOccurred?.('success');
    }
    return;
  }

  // Recording money he put in beyond the schedule, and taking one back out again.
  const payAdd = e.target.closest('[data-pay-add]');
  if (payAdd) { openExtraPayment(payAdd.dataset.payAdd); return; }
  const payDel = e.target.closest('[data-pay-del]');
  if (payDel) {
    if (!await ask('Remove this extra payment?')) return;
    await work(() => api('/api/payment', { id: payDel.dataset.acct, remove: payDel.dataset.payDel }));
    return;
  }

  const fxBtn = e.target.closest('[data-fx]');
  if (fxBtn) { openFxBasis(fxBtn.dataset.fx); return; }

  const chg = e.target.closest('[data-charge]');
  if (chg) {
    if (await work(() => api('/api/charge', { id: chg.dataset.charge }))) {
      tg?.HapticFeedback?.notificationOccurred?.('success');
    }
    return;
  }

  const planEdit = e.target.closest('[data-plan-edit]');
  if (planEdit) {
    const piece = (S.events || []).find((x) => x.id === planEdit.dataset.planEdit);
    if (piece) openPlanEvent(piece);
    return;
  }
  // Whether the plan starts from what he measured, or only from what he has listed. Both are
  // honest; which he means is his call, and it has to be visible rather than assumed.
  const planBase = e.target.closest('[data-plan-base]');
  if (planBase) {
    await work(() => api('/api/plan', { useMeasured: planBase.dataset.planBase === 'on' }));
    return;
  }

  const planDel = e.target.closest('[data-plan-del]');
  if (planDel) {
    if (!await ask('Remove this change from the plan?')) return;
    await work(() => api('/api/plan', { remove: planDel.dataset.planDel }));
    return;
  }
  const btn = e.target.closest('[data-del]');
  if (!btn) return;
  // Named, not "Remove this?". A generic confirmation beside a mis-tappable button is how the
  // wrong row gets deleted, and there is no undo behind it.
  const what = btn.dataset.del === 'flow'
    ? (S.flows.find((f) => f.id === btn.dataset.id)?.category || 'this entry')
    : btn.dataset.del === 'sub'
      ? ((S.subs?.rows || []).find((r) => r.id === btn.dataset.id)?.label || 'this subscription')
      : (S.accounts.find((a) => a.id === btn.dataset.id)?.label || 'this holding');
  if (!await ask(`Delete “${what}”? This cannot be undone.`)) return;
  await work(() => api('/api/remove', { kind: btn.dataset.del, id: btn.dataset.id }));
});

(async () => {
  try { S = await api('/api/state'); draw(); }
  catch (err) {
    document.querySelector('.wrap').innerHTML =
      `<div class="card"><div class="empty">${esc(err.message)}<br><br>Open this from the button in your Pocket chat.</div></div>`;
  }
})();
</script>
</body>
</html>
